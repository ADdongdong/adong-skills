<!-- title: Loading State -->
<!--@classes: rounded-full rounded-[1px]-->
<!-- 来源：components/primitives/LoadingState.tsx（上游 MIT）
     变体：Drive / Dots / Orbit / Surfer
     保真：pixel-on 波浪、shimmer 标签（1.4s）、100ms 计时器、pop-in 上下文卡与上游一致；
           所有时序常量逐字照搬。Surfer 变体的视频走上游 Vercel Blob，离线时自动回退。
     @classes 里声明的是 JS 三元产生的分支类（rounded-full / rounded-[1px]），
     它们不出现在静态 markup 的 class 属性里，必须显式声明。-->

<div class="port-frame">
  <p class="port-note">
    <strong>加载状态</strong> — 像素网格加载器 + 微光标签 + 实时计时器。
    用于「Agent 正在跑」这类不确定时长的等待。<code>pixel-on</code> 是关键帧，
    逐格错开延迟形成波浪前沿。
  </p>

  <div class="port-variants" role="group" aria-label="变体">
    <button type="button" class="port-variant-btn" data-variant="Drive" aria-pressed="true">Drive</button>
    <button type="button" class="port-variant-btn" data-variant="Dots" aria-pressed="false">Dots</button>
    <button type="button" class="port-variant-btn" data-variant="Orbit" aria-pressed="false">Orbit</button>
    <button type="button" class="port-variant-btn" data-variant="Surfer" aria-pressed="false">Surfer</button>
  </div>

  <div id="loader-host"></div>
</div>

<script>
/* ── 逐字照搬上游的延迟表 ──────────────────────────────────────
 * chevron: Array.from({length:9}, (_,i) => { const r=Math.floor(i/3), c=i%3;
 *                                            return (c + Math.abs(r-1)) * 90; })
 * ORBIT_ORDER = [0,1,2,5,8,7,6,3]; orbit[i] = ORBIT_ORDER.indexOf(i) * 110
 *             （不在环上的第 4 格为 null）
 * 驱动时长：Drive/Dots 650ms，Orbit 950ms。
 * ──────────────────────────────────────────────────────────── */
var CHEVRON = Array.from({ length: 9 }, function (_, i) {
  var r = Math.floor(i / 3), c = i % 3;
  return (c + Math.abs(r - 1)) * 90;
});
var ORBIT_ORDER = [0, 1, 2, 5, 8, 7, 6, 3];
var ORBIT = Array.from({ length: 9 }, function (_, i) {
  var k = ORBIT_ORDER.indexOf(i);
  return k === -1 ? null : k * 110;
});
var PATTERNS = {
  Drive:  { delays: CHEVRON, dur: 650, round: false },
  Dots:   { delays: CHEVRON, dur: 650, round: true  },
  Orbit:  { delays: ORBIT,   dur: 950, round: false },
  Surfer: { delays: CHEVRON, dur: 650, round: false }
};
var VIDEO_SRC = 'https://95dnc2a95qgwt9ff.public.blob.vercel-storage.com/subway-surfers-min.mp4';

/* 一遍 100ms：total = ds / 10，<60s 显示 X.Xs，否则 Xm Y.Ys */
var elapsedDs = 0;
function elapsedText() {
  var total = elapsedDs / 10;
  if (total < 60) return total.toFixed(1) + 's';
  return Math.floor(total / 60) + 'm ' + (total % 60).toFixed(1) + 's';
}
setInterval(function () {
  elapsedDs += 1;
  var el = document.querySelectorAll('[data-elapsed]');
  for (var i = 0; i < el.length; i++) el[i].textContent = elapsedText();
}, 100);

/* 9 格网格：opacity 0.07（不在图案上）/ 0.15，animation pixel-on */
function loaderGrid(p) {
  var cells = '';
  for (var i = 0; i < 9; i++) {
    var delay = p.delays[i];
    var style = delay === null
      ? 'opacity:0.07;animation:none'
      : 'opacity:0.15;animation:pixel-on ' + p.dur + 'ms ease-in-out ' + delay + 'ms infinite';
    cells += '<span class="size-[4px] bg-ink ' + (p.round ? 'rounded-full' : 'rounded-[1px]')
           + '" style="' + style + '"></span>';
  }
  return '<span aria-hidden class="grid shrink-0 grid-cols-[repeat(3,4px)] gap-[1.5px]">'
       + cells + '</span>';
}

/* 微光标签：shimmer-text 1.4s linear infinite + background-clip:text */
function labelEl(text) {
  return '<span class="bg-clip-text text-[13px] font-medium text-transparent" style="'
       + 'background-image:linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%);'
       + 'background-size:200% 100%;animation:shimmer-text 1.4s linear infinite">'
       + text + '</span>';
}

function elapsedEl() {
  return '<span data-elapsed class="font-mono text-[12px] text-ink-3 tabular-nums">'
       + elapsedText() + '</span>';
}

var videoOk = true;

function render(variant) {
  var host = document.getElementById('loader-host');
  if (variant === 'Surfer') {
    var card = videoOk
      ? '<video src="' + VIDEO_SRC + '" autoplay muted loop playsinline '
        + 'class="h-full w-full object-cover"></video>'
      : '<div class="flex h-full w-full flex-col items-center justify-center gap-1.5">'
        + loaderGrid(PATTERNS.Drive)
        + '<span class="px-3 text-center font-mono text-[10px]" style="color:var(--tooltip-muted)">Video unavailable</span>'
        + '</div>';
    host.innerHTML =
      '<div role="status" class="flex w-fit flex-col items-start">'
      +   '<div class="flex items-center gap-2.5">'
      +     loaderGrid(PATTERNS.Drive) + labelEl('Subway surfing') + elapsedEl()
      +   '</div>'
      +   '<div class="mt-2 w-56 overflow-hidden rounded-[10px] shadow-overlay" style="'
      +     'animation:pop-in 200ms cubic-bezier(0.16,1,0.3,1) both;transform-origin:top left">'
      +     '<div class="relative aspect-video w-full" style="background:var(--tooltip-bg)">' + card + '</div>'
      +   '</div>'
      + '</div>';
    var v = host.querySelector('video');
    if (v) v.addEventListener('error', function () { videoOk = false; render('Surfer'); });
    return;
  }
  var p = PATTERNS[variant] || PATTERNS.Drive;
  host.innerHTML =
    '<div role="status" class="flex w-fit items-center gap-2.5">'
    + loaderGrid(p) + labelEl('Churning') + elapsedEl()
    + '</div>';
}

var btns = document.querySelectorAll('.port-variant-btn');
for (var i = 0; i < btns.length; i++) {
  btns[i].addEventListener('click', function () {
    for (var j = 0; j < btns.length; j++) btns[j].setAttribute('aria-pressed', 'false');
    this.setAttribute('aria-pressed', 'true');
    render(this.getAttribute('data-variant'));
  });
}
render('Drive');
</script>
