/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

}

}

  from {
    background-position: 150% center;
  }
  to {
    background-position: -50% center;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — RecordsTable
 * The full CRM grid, spreadsheet gutter, and AI column (~800 lines).
 * Copy this block only alongside RecordsTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.records-shell {
  width: 100%;
  min-width: 0;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  box-shadow: 0 1px 2px oklch(0 0 0 / 0.06);
}

/* fill mode: the shell stretches to fill its container and drops its own
 * border/radius/shadow so it reads as part of the surrounding card rather
 * than a container-in-a-container. The grid body flexes to fill height. */
.records-shell.is-fill {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-height: 0;
  height: 100%;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}

.records-shell.is-fill .records-scroll {
  max-height: none;
  flex: 1;
}

.records-toolbar {
  display: flex;
  min-height: 52px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line-strong);

/* ── filter table electric status colors ─────────────────── */


/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── 工具类（Tailwind 子集，由 twsubset.py 编译）───────────────
 * 颜色/圆角/阴影/缓动全部引用同名 var(--token)，
 * 因此配色与动效曲线与官网一致。
 * 选择器一律写成 [class~=] 属性形式而非转义类名：
 * 工具类含斜杠、冒号、方括号、百分号，转义极易出错。
 */

[class~="transition-[background-color,transform]"] {
  transition-property: background-color,transform;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-[box-shadow]"] {
  transition-property: box-shadow;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-colors"] {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-transform"] {
  transition-property: transform, translate, scale, rotate;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="duration-100"] {
  transition-duration: 100ms;
}

[class~="duration-150"] {
  transition-duration: 150ms;
}

[class~="-inset-x-1.5"] {
  left: calc(0.375rem * -1);
  right: calc(0.375rem * -1);
}

[class~="-mx-1.5"] {
  margin-left: calc(0.375rem * -1);
  margin-right: calc(0.375rem * -1);
}

[class~="absolute"] {
  position: absolute;

      '<span class="flex items-center gap-2">' + miniSwitch("Grounding", grounding, "grounding")
      + '<button type="button" aria-label="About grounding" aria-expanded="' + groundingHelpOpen + '" data-grounding-help class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover hover:text-ink">' + icon('<g><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v4h1"/></g>', 13) + '</button></span>')
      + (groundingHelpOpen ? '<div class="absolute right-0 top-[30px] z-30 w-[230px] rounded-[10px] px-3 py-2.5 text-[12px] leading-relaxed shadow-overlay" style="color:var(--tooltip-fg);background:var(--tooltip-bg)" role="status">Grounding lets the model verify generated values against connected sources.</div>' : '');
    var inputsRow = configRow("Inputs",
      '<button type="button" aria-haspopup="menu" aria-expanded="' + (configMenu === "inputs") + '" data-configmenu="inputs" class="flex max-w-[220px] items-center gap-1.5 rounded-[6px] px-1.5 py-1 text-[13px] text-ink-2 transition-colors duration-100 hover:bg-hover hover:text-ink">'
      + (selInputs.length
        ? '<span class="flex min-w-0 items-center gap-1">' + selInputs.slice(0, 2).map(function (s) { return '<span class="max-w-[92px] truncate rounded-[5px] bg-accent-tint px-1.5 py-0.5 text-[12px] font-medium text-accent-ink">' + s + '</span>'; }).join('') + (selInputs.length > 2 ? '<span class="text-[11px] font-medium text-ink-3">+' + (selInputs.length - 2) + '</span>' : '') + '</span>'
        : '<span>Select inputs</span>')
      + '<span class="shrink-0 text-ink-3">' + chevronRight() + '</span></button>'
      + (configMenu === "inputs" ? inputPicker(selInputs, prop.col) : ''));
    var prompt = '<div contenteditable="true" role="textbox" aria-label="' + prop.col + ' calculation prompt" aria-multiline="true" spellcheck="true" class="mt-2 min-h-[88px] cursor-text rounded-[10px] bg-inset p-3 text-[13px] leading-relaxed shadow-hairline outline-none transition-[box-shadow] duration-150 focus:shadow-[0_0_0_2px_var(--accent)]">'
      + (meta.prompt
        ? '<span class="text-ink">' + meta.prompt.before + (meta.prompt.chip ? '<span contenteditable="false" class="rounded-[5px] bg-accent-tint px-1.5 py-0.5 text-[12px] font-medium text-accent-ink">' + meta.prompt.chip + '</span>' : '') + (meta.prompt.after || '') + '</span>'
        : '<span class="text-ink-3">Set a prompt (press @ to mention an input)</span>')
      + '</div>';
    var goBtn = '<button type="button" data-gocalc ' + (calc ? 'disabled ' : '') + 'class="mt-2.5 flex h-9 w-full items-center justify-center gap-2 rounded-[9px] text-[12.5px] font-medium text-ink shadow-btn transition-[background-color,transform] duration-150 hover:bg-hover active:scale-[0.98] disabled:opacity-60">'
      + icon('<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>', 14, 1.9) + 'Go calculate</button>';
    var pinRow = '<button data-menu-row type="button" aria-pressed="' + pinned + '" data-pin class="relative z-10 -mx-1.5 flex h-8 items-center gap-2.5 rounded-[8px] px-1.5 text-left text-[13px] leading-none text-ink transition-transform duration-150 active:scale-[0.96]">'
      + '<span class="' + (pinned ? "text-accent" : "text-ink-2") + '">' + icon('<path d="M12 17v5M8 3h8l-1 7 3 3H6l3-3-1-7z"/>', 15) + '</span>' + (pinned ? "Unpin" : "Pin") + '</button>';
    var moreRow = '<button data-menu-row type="button" aria-expanded="' + moreSettingsOpen + '" data-more class="relative z-10 -mx-1.5 flex h-8 items-center gap-2.5 rounded-[8px] px-1.5 text-left text-[13px] leading-none text-ink transition-transform duration-150 active:scale-[0.96]">'
      + '<span class="' + (moreSettingsOpen ? "text-ink" : "text-ink-2") + '">' + icon('<g><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1 7 17M17 7l2.1-2.1"/></g>', 15) + '</span>'
      + '<span class="flex-1">More settings</span>'
      + '<span class="text-ink-3 transition-transform duration-150 ' + (moreSettingsOpen ? "rotate-90" : "") + '">' + chevronRight() + '</span></button>';
    var hideRow = prop.col === AI_LABEL
      ? '<button data-menu-row type="button" data-hide-ai class="relative z-10 -mx-1.5 flex h-8 items-center gap-2.5 rounded-[8px] px-1.5 text-left text-[13px] leading-none text-ink transition-transform duration-150 active:scale-[0.96]">'
        + '<span class="text-ink-2">' + icon('<g><path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c7 0 10 7 10 7a16.3 16.3 0 0 1-2.1 3M6.6 6.6A16 16 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6M3 3l18 18"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></g>', 15) + '</span>Hide from view</button>'
      : '';
    var moreSection = moreSettingsOpen
      ? '<div class="mt-2 border-t border-line pt-2" style="animation:fade-up 160ms cubic-bezier(0.23,1,0.32,1) both">'
        + '<div class="pb-1 text-[11.5px] font-medium text-ink-3">Behavior</div>'
        + configRow("Required value", miniSwitch("Required value", advancedSettings.required, "required"))
        + configRow("Allow empty results", miniSwitch("Allow empty results", advancedSettings.allowEmpty, "allowEmpty"))
        + configRow("Show confidence", miniSwitch("Show confidence", advancedSettings.confidence, "confidence"))
        + '</div>'
      : '';
    return '<div class="pb-2 text-[13.5px] font-medium text-ink">' + prop.col + '</div>'
      + configRow("Type", typeBtn) + configRow("Tool", toolBtn) + groundingRow + inputsRow
      + prompt + goBtn
      + glideWrap(pinRow + moreRow + hideRow, 'mt-3 flex flex-col gap-0.5 border-t border-line pt-2', '-inset-x-1.5 rounded-[8px] bg-hover')
      + moreSection;
  }

  function addMenuHTML() {
    var rows = NEW_PROPERTY_TYPES.map(function (t) {
      return '<button data-menu-row type="button" data-add-type="' + t + '" class="relative z-10 flex h-9 w-full items-center gap-2.5 rounded-[8px] px-2 text-left text-[13px] text-ink">'
        + '<span class="text-ink-2">' + icon(TYPE_GLYPHS[t], 15) + '</span>' + t + '</button>';
    }).join('');
    return '<div class="px-2 pb-1 pt-1 text-[12px] font-medium text-ink-3">New property</div>'
      + glideWrap(rows, 'flex flex-col gap-px', 'inset-x-0 rounded-[8px] bg-hover');
  }
  function tableMenuHTML() {
    function item(attr, label, glyph) {
      return '<button data-menu-row type="button" ' + attr + ' class="relative z-10 flex h-9 w-full items-center gap-2.5 rounded-[8px] px-2 text-left text-[13px] text-ink">'
        + '<span class="text-ink-2">' + icon(glyph, 15) + '</span>' + label + '</button>';
    }
    return '<div class="px-2 pb-1 pt-1 text-[12px] font-medium text-ink-3">Table options</div>'
      + glideWrap(
        item('data-tm-add', "Add property", '<path d="M12 5v14M5 12h14"/>')
        + item('data-tm-compact', "Compact columns", '<path d="M4 8h16M7 4 3 8l4 4M17 4l4 4-4 4M4 16h16"/>')
        + item('data-tm-reset', "Reset column widths", '<path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6"/>')
        + '<div class="my-1 h-px bg-line"></div>'
        + item('data-tm-clear', "Clear selection", '<path d="M5 5l14 14M19 5 5 19"/>'),
        'flex flex-col gap-px', 'inset-x-0 rounded-[8px] bg-hover');
  }

  /* ── glide (inlined GlideMenu) ── */
  function initGlide(root) {
    if (!root || root.__glide) return;
    root.__glide = true;
    var sel = root.getAttribute('data-row-selector') || '[data-menu-row]';
    var layer = root.querySelector('[data-glide-layer]');
    function moveTo(target) {
      if (!(target instanceof Element)) return;
      var row = target.closest(sel);
      if (!row || !root.contains(row)) return;
      var cr = root.getBoundingClientRect(), rr = row.getBoundingClientRect();
      layer.style.top = (rr.top - cr.top) + 'px';
      layer.style.height = rr.height + 'px';
      layer.style.opacity = '1';
    }
    root.addEventListener('mouseover', function (e) { moveTo(e.target); });
    root.addEventListener('mouseleave', function () { layer.style.opacity = '0'; });
    root.addEventListener('focusin', function (e) { moveTo(e.target); });
    root.addEventListener('focusout', function (e) { if (!root.contains(e.relatedTarget)) layer.style.opacity = '0'; });
  }

  /* ── render ── */
  var host = document.getElementById('rt-host');
  var shellEl = document.createElement('div');
  var popEl = null, addEl = null, menuEl = null;

  function renderTable() {
    shellEl.innerHTML = tableHTML();
    initGlide(shellEl.querySelector('[data-glide-root]'));
    /* programmatic scrolls (revealing the new column) shouldn't close popovers */
    var scroller = shellEl.querySelector('.records-scroll');
    if (scroller) scroller.addEventListener('scroll', function () {
      if (ignoreScroll) { ignoreScroll = false; return; }
      if (prop || addOpen || tableMenuOpen) { closeAllPops(); sync(); }
    });
  }
  function postRenderTags() {
    var cells = shellEl.querySelectorAll('[data-tags-row]');
    for (var i = 0; i < cells.length; i++) {
      var id = cells[i].getAttribute('data-tags-row');
      var row = INITIAL_ROWS.filter(function (r) { return r.id === id; })[0];
      if (row) fillTags(cells[i], row.tags);
    }
  }
  function ensurePop() {
    if (!prop) { if (popEl) { popEl.remove(); popEl = null; } return; }
    var x = Math.min(prop.x, window.innerWidth - 336);
    if (!popEl) {
      popEl = document.createElement('div');
      popEl.setAttribute('data-recpop', '');
      popEl.className = 'fixed z-50 w-[320px] rounded-[14px] bg-surface px-3 pt-3 pb-1.5 shadow-overlay';
      popEl.style.animation = 'pop-in 160ms cubic-bezier(0.23,1,0.32,1) both';
      popEl.style.transformOrigin = 'top left';
      document.body.appendChild(popEl);
    }
    popEl.style.top = prop.y + 'px';
    popEl.style.left = x + 'px';
    popEl.innerHTML = popoverHTML();
    var g = popEl.querySelector('[data-glide-root]');
    if (g) { g.__glide = false; initGlide(g); }
  }
  function ensureAdd() {
    if (!addOpen) { if (addEl) { addEl.remove(); addEl = null; } return; }
    if (!addEl) {
      addEl = document.createElement('div');
      addEl.setAttribute('data-recpop', '');
      addEl.className = 'fixed z-50 w-[260px] rounded-[14px] bg-surface p-1.5 shadow-overlay';
      addEl.style.animation = 'pop-in 160ms cubic-bezier(0.23,1,0.32,1) both';
      addEl.style.transformOrigin = 'top left';
      document.body.appendChild(addEl);
    }
    addEl.style.top = addOpen.y + 'px';
    addEl.style.left = addOpen.x + 'px';
    addEl.innerHTML = addMenuHTML();
    var g = addEl.querySelector('[data-glide-root]');
    if (g) { g.__glide = false; initGlide(g); }
  }
  function ensureTableMenu() {
    if (!tableMenuOpen) { if (menuEl) { menuEl.remove(); menuEl = null; } return; }
    if (!menuEl) {
      menuEl = document.createElement('div');
      menuEl.setAttribute('data-recpop', '');
      menuEl.className = 'fixed z-50 w-[220px] rounded-[14px] bg-surface p-1.5 shadow-overlay';
      menuEl.style.animation = 'pop-in 160ms cubic-bezier(0.23,1,0.32,1) both';
      menuEl.style.transformOrigin = 'top right';
      document.body.appendChild(menuEl);
    }
    menuEl.style.top = tableMenuOpen.y + 'px';
    menuEl.style.left = tableMenuOpen.x + 'px';
    menuEl.innerHTML = tableMenuHTML();
    var g = menuEl.querySelector('[data-glide-root]');
    if (g) { g.__glide = false; initGlide(g); }
  }
  function sync() {
    renderTable();
    postRenderTags();
    ensurePop();
    ensureAdd();
    ensureTableMenu();
  }

  /* ── interactions ── */
  host.appendChild(shellEl);

  function closeAllPops() {
    prop = null; configMenu = null; groundingHelpOpen = false; moreSettingsOpen = false; addOpen = null; tableMenuOpen = null;
  }
  document.addEventListener('pointerdown', function (event) {
    if (!prop && !addOpen && !tableMenuOpen) return;
    if (!event.target.closest('[data-recpop]')) { closeAllPops(); sync(); }
  });

  function openProp(col, el) {
    var th = el.closest('th');
    if (!th) return;
    addOpen = null; tableMenuOpen = null; configMenu = null; groundingHelpOpen = false; moreSettingsOpen = false;
    if (prop && prop.col === col) { prop = null; }
    else {
      var rect = th.getBoundingClientRect();
      prop = { col: col, x: Math.min(rect.left, window.innerWidth - 336), y: rect.bottom + 6 };
    }
    ignoreScroll = true;
    sync();
  }

  /* popovers are portaled to <body>, so delegate on document */
  document.addEventListener('click', function (event) {
    var t = event.target;
    if (!t.closest || !t.closest('[data-openprop],[data-sort],[data-add],[data-tablemenu],[data-configmenu],[data-grounding-help],[data-more],[data-pin],[data-config-pick],[data-input-pick],[data-gocalc],[data-hide-ai],[data-add-type],[data-tm-add],[data-tm-compact],[data-tm-reset],[data-tm-clear],[data-switch]')) return;
    if (t.closest('.records-checkbox')) return;
    var sortBtn = t.closest('[data-sort]');
    if (sortBtn) { var k = sortBtn.getAttribute('data-sort'); sort = sort.key === k ? { key: k, dir: sort.dir * -1 } : { key: k, dir: 1 }; sync(); return; }
    var openB = t.closest('[data-openprop]');
    if (openB) { openProp(openB.getAttribute('data-openprop'), openB); return; }
    if (t.closest('[data-add]')) {
      var r = t.closest('[data-add]').getBoundingClientRect();
      tableMenuOpen = null; prop = null;
      addOpen = addOpen ? null : { x: Math.min(r.left, window.innerWidth - 276), y: r.bottom + 6 };
      ignoreScroll = true; sync(); return;
    }
    if (t.closest('[data-tablemenu]')) {
      var rr = t.closest('[data-tablemenu]').getBoundingClientRect();
      addOpen = null; prop = null;
      tableMenuOpen = tableMenuOpen ? null : { x: Math.max(8, Math.min(rr.right - 220, window.innerWidth - 228)), y: rr.bottom + 6 };
      ignoreScroll = true; sync(); return;
    }
    if (t.closest('[data-configmenu]')) {
      var which = t.closest('[data-configmenu]').getAttribute('data-configmenu');
      configMenu = configMenu === which ? null : which;
      ensurePop(); return;
    }
    if (t.closest('[data-grounding-help]')) { groundingHelpOpen = !groundingHelpOpen; ensurePop(); return; }
    if (t.closest('[data-more]')) { moreSettingsOpen = !moreSettingsOpen; ensurePop(); return; }
    if (t.closest('[data-pin]')) {
      var i = pinnedColumns.indexOf(prop.col);
      if (i > -1) pinnedColumns.splice(i, 1); else pinnedColumns.push(prop.col);
      ensurePop(); return;
    }
    var cp = t.closest('[data-config-pick]');
    if (cp) {
      var val = cp.getAttribute('data-config-pick');
      var ov = columnOverrides[prop.col] || {};
      if (configMenu === "type") ov.type = val;
      else { ov.tool = val; ov.toolKind = "model"; }
      columnOverrides[prop.col] = ov; configMenu = null; ensurePop(); return;
    }
    var ip = t.closest('[data-input-pick]');
    if (ip) {
      var v = ip.getAttribute('data-input-pick');
      var cur = inputSelections[prop.col] || (COLUMN_META[prop.col] && COLUMN_META[prop.col].inputs ? [COLUMN_META[prop.col].inputs] : []);
      cur = cur.slice();
      var j = cur.indexOf(v);
      if (j > -1) cur.splice(j, 1); else cur.push(v);
      inputSelections[prop.col] = cur; ensurePop(); return;
    }
    if (t.closest('[data-gocalc]')) { startCalc(prop.col); return; }
    if (t.closest('[data-hide-ai]')) { aiAdded = false; aiDone = false; prop = null; sync(); return; }
    var at = t.closest('[data-add-type]');
    if (at) {
      addOpen = null; aiDone = false; aiAdded = true; sync();
      /* after adding the AI column, scroll it into view and open its config
         anchored to the new header (upstream pendingOpenAi) */
      var th = shellEl.querySelector('[data-openprop="' + AI_LABEL + '"]');
      if (th) {
        var sc = shellEl.querySelector('.records-scroll');
        if (sc) { ignoreScroll = true; sc.scrollLeft = sc.scrollWidth; }
        var tr2 = th.closest('th').getBoundingClientRect();
        prop = { col: AI_LABEL, x: Math.min(tr2.left, window.innerWidth - 336), y: tr2.bottom + 6 };
      }
      sync(); return;
    }
    if (t.closest('[data-tm-add]')) { var p0 = tableMenuOpen; tableMenuOpen = null; addOpen = { x: Math.min(p0.x, window.innerWidth - 276), y: p0.y }; sync(); return; }
    if (t.closest('[data-tm-compact]')) { columnWidths = { company: 220, categories: 220, last: 155, strength: 180, links: 160, ai: 200 }; tableMenuOpen = null; sync(); return; }
    if (t.closest('[data-tm-reset]')) { columnWidths = { company: 270, categories: 275, last: 190, strength: 210, links: 175, ai: 240 }; tableMenuOpen = null; sync(); return; }
    if (t.closest('[data-tm-clear]')) { selected = []; tableMenuOpen = null; sync(); return; }
    var sw = t.closest('[data-switch]');
    if (sw) {
      var id = sw.getAttribute('data-switch');
      if (id === "grounding") grounding = !grounding;
      else advancedSettings[id] = !advancedSettings[id];
      ensurePop(); return;
    }
  });

  document.addEventListener('change', function (event) {
    var el = event.target.closest ? event.target.closest('[data-check]') : null;
    if (!el) return;
    var id = el.getAttribute('data-check');
    var rows = visibleRows();
    if (id === "all") {
      var allSel = rows.every(function (r) { return isSelected(r.id); });
      if (allSel) selected = selected.filter(function (s) { return !rows.some(function (r) { return r.id === s; }); });
      else rows.forEach(function (r) { if (!isSelected(r.id)) selected.push(r.id); });
    } else {
      var rid = id.slice(4);
      var k = selected.indexOf(rid);
      if (k > -1) selected.splice(k, 1); else selected.push(rid);
    }
    sync();
  });

  document.addEventListener('pointerdown', function (event) {
    var handle = event.target.closest ? event.target.closest('[data-resize]') : null;
    if (!handle) return;
    event.preventDefault();
    var key = handle.getAttribute('data-resize');
    var minWidth = Number(handle.getAttribute('data-min')) || 120;
    closeAllPops();
    var startX = event.clientX, startWidth = columnWidths[key];
    var prevCursor = document.body.style.cursor, prevSel = document.body.style.userSelect;
    document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
    resizingColumn = key; sync();
    function move(e) { columnWidths[key] = Math.max(minWidth, startWidth + e.clientX - startX); sync(); }
    function finish() {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', finish);
      window.removeEventListener('pointercancel', finish);
      document.body.style.cursor = prevCursor; document.body.style.userSelect = prevSel;
      resizingColumn = null; sync();
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', finish);
    window.addEventListener('pointercancel', finish);
  });

  function startCalc(col) {
    calc = { col: col, resolved: 0 };
    prop = null; configMenu = null;
    if (calcTimer) { clearInterval(calcTimer); calcTimer = null; }
    sync();
    calcTimer = setInterval(function () {
      if (!calc) { clearInterval(calcTimer); calcTimer = null; return; }
      calc.resolved++;
      if (calc.resolved > visibleRows().length) {
        if (calc.col === AI_LABEL) aiDone = true;
        calc = null; clearInterval(calcTimer); calcTimer = null;
      }
      sync();
    }, 110);
  }

  sync();
  /* re-measure tags once fonts settle (mirrors upstream ResizeObserver pass) */
  window.addEventListener('load', function () { postRenderTags(); });
  window.addEventListener('resize', function () { postRenderTags(); });
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
