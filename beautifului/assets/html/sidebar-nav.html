/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

/* ── primitive spacing system ─────────────────────────────

}

}

}

/* ── shared keyframes ─────────────────────────────────── */

@keyframes shimmer-text {
  from {
    background-position: 150% center;
  }
  to {
    background-position: -50% center;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

.sidebar-row {

  transition-duration: var(--sidebar-copy-duration);
  transition-timing-function: var(--sidebar-easing);
}

.sidebar-copy {
  opacity: 1;
  transform: translateX(0);
  transition:
    opacity var(--sidebar-copy-duration) ease-out,
    transform var(--sidebar-copy-duration) var(--sidebar-easing);
}

.sidebar-logo,
.sidebar-collapse-control,
.sidebar-expand-control {
  transition-duration: var(--sidebar-copy-duration);
  transition-timing-function: ease-out;
}

.sidebar-expand-control {
  pointer-events: none;
  opacity: 0;
}

.sidebar-glide-highlight {
  right: 8px;
  left: 8px;
}

  width: 36px;
}

[data-sidebar-collapsed="true"] .sidebar-copy {
  pointer-events: none;
  opacity: 0;
  transform: translateX(calc(var(--sidebar-copy-offset) * -1));

/* ── records table ────────────────────────────────────────
 * The grid is deliberately more architectural than card-like:
 * one quiet surface, precise rules, and color reserved for
 * meaning. The first column remains an anchor while both axes
 * can move independently inside the table viewport.
 */


/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

  function asideHTML() {
    return '<aside data-sidebar-collapsed="false" aria-label="Workspace navigation" class="relative flex shrink-0 overflow-hidden transition-[width] h-[600px]" '
      + 'style="width:' + SIDEBAR_MOTION.expandedWidth + 'px;transition-duration:' + SIDEBAR_MOTION.duration + 'ms;transition-timing-function:' + SIDEBAR_MOTION.easing + ';'
      + '--sidebar-copy-duration:' + SIDEBAR_MOTION.copyDuration + 'ms;--sidebar-copy-offset:' + SIDEBAR_MOTION.copyOffset + 'px;--sidebar-easing:' + SIDEBAR_MOTION.easing + '">'
      + '<div class="flex min-h-0 w-[224px] shrink-0 flex-col">'
      +   '<div class="relative mb-2.5 h-10 shrink-0">'
      +     '<button data-workspace-trigger type="button" aria-expanded="false" class="sidebar-workspace-control absolute left-2 top-1 flex h-8 w-[164px] items-center rounded-[8px] px-2 text-left transition-[background-color,transform] duration-100 hover:bg-hover-2 active:scale-[0.99]">'
      +       '<span class="sidebar-logo flex size-5 shrink-0 items-center justify-center text-ink">' + I.popsicle(18) + '</span>'
      +       '<span class="sidebar-copy ml-1.5 min-w-0 flex-1 truncate text-[14px] font-medium text-ink-2">' + WORKSPACE.name + '</span>'
      +       '<span class="sidebar-copy ml-1 flex shrink-0 text-ink-3">' + I.chevronDown(16) + '</span>'
      +     '</button>'
      +     '<button type="button" aria-label="Collapse sidebar" data-collapse class="sidebar-collapse-control absolute right-2 top-1 flex size-8 items-center justify-center rounded-[8px] text-ink-3 transition-[opacity,background-color,color] duration-150 hover:bg-hover-2 hover:text-ink">' + I.sidebar(18) + '</button>'
      +     '<button type="button" aria-label="Expand sidebar" data-expand class="sidebar-expand-control absolute left-2 top-0.5 flex size-9 items-center justify-center rounded-[8px] text-ink-3 transition-[opacity,background-color,color] duration-150 hover:bg-hover-2 hover:text-ink">' + I.sidebar(18, "rotate-180") + '</button>'
      +   '</div>'
      /* primary nav — gliding hover */
      +   '<div data-glide-root data-row-selector="[data-row]" class="group/glide relative flex flex-col gap-px">'
      +     '<span aria-hidden data-glide-layer class="pointer-events-none absolute sidebar-glide-highlight rounded-[7px] bg-hover-2" style="' + GLIDE_STYLE + '"></span>'
      +     '<div data-rail-rows class="contents">' + railHTML() + '</div>'
      +   '</div>'
      +   '<div class="mt-3 min-h-0 flex-1 overflow-y-auto">'
      +     '<div class="sidebar-copy relative mx-2 mb-1 h-8">'
      +       '<div data-chats-label aria-hidden="false" class="absolute inset-0 flex items-center gap-1.5 px-2 text-[12.5px] font-medium text-ink-3 transition-[opacity,transform] translate-x-0 opacity-100" style="transition-duration:' + CHAT_SEARCH_MOTION.duration + 'ms;transition-timing-function:' + CHAT_SEARCH_MOTION.easing + '">'
      +         I.chevronDown(16) + '<span>Chats</span>'
      +       '</div>'
      +       '<button type="button" aria-label="Search chats" aria-expanded="false" data-search-open class="absolute right-0 top-0 z-10 flex size-8 items-center justify-center rounded-[8px] text-ink-3 transition-[opacity,background-color,color,transform] hover:bg-hover-2 hover:text-ink active:scale-[0.96] opacity-100" style="transition-duration:' + CHAT_SEARCH_MOTION.duration + 'ms">' + I.search(16) + '</button>'
      +       '<div data-search-field class="absolute right-0 top-0 z-20 flex h-8 items-center overflow-hidden rounded-[8px] bg-field text-ink-3 shadow-hairline transition-[width,opacity] focus-within:text-ink-2 pointer-events-none opacity-0" style="width:' + CHAT_SEARCH_MOTION.closedWidth + 'px;transition-duration:' + CHAT_SEARCH_MOTION.duration + 'ms;transition-timing-function:' + CHAT_SEARCH_MOTION.easing + '">'
      +         '<span class="ml-2 flex shrink-0 items-center justify-center">' + I.search(15) + '</span>'
      +         '<input data-search-input type="text" placeholder="Search chats" aria-label="Search chat history" class="ml-1.5 min-w-0 flex-1 bg-transparent text-[13px] font-medium text-ink outline-none placeholder:text-ink-3">'
      +         '<button type="button" aria-label="Close chat search" data-search-close class="flex size-8 shrink-0 items-center justify-center rounded-[8px] text-ink-3 transition-[background-color,color,transform] duration-150 hover:bg-hover-2 hover:text-ink active:scale-[0.96]">' + I.cross(16) + '</button>'
      +       '</div>'
      +     '</div>'
      +     '<div data-glide-root data-row-selector="[data-row]" class="group/glide relative flex flex-col gap-px">'
      +       '<span aria-hidden data-glide-layer class="pointer-events-none absolute sidebar-glide-highlight rounded-[7px] bg-hover-2" style="' + GLIDE_STYLE + '"></span>'
      +     '</div>'
      +   '</div>'
      +   '<div class="sidebar-copy mx-2 mt-3 w-[208px] border-t border-line pt-3">'
      +     '<button type="button" data-footer class="flex h-8 w-full items-center justify-center gap-1.5 rounded-control bg-hover-2 text-[12.5px] font-medium text-ink transition-[background-color,transform] duration-150 hover:bg-line-strong active:scale-[0.98]">Upgrade</button>'
      +   '</div>'
      + '</div>'
      + '</aside>';
  }

  var host = document.getElementById('sb-host');
  host.innerHTML = asideHTML();

  var aside = host.querySelector('aside');
  var railRows = host.querySelector('[data-rail-rows]');
  var recentsRoot = host.querySelector('[data-glide-root][data-row-selector]');
  /* the recents glide root is the 2nd glide root */
  var glideRoots = host.querySelectorAll('[data-glide-root]');
  var recentsGlideRoot = glideRoots[1];

  /* ── GlideMenu (inlined from primitives/GlideMenu.tsx) ── */
  function initGlide(root) {
    var sel = root.getAttribute('data-row-selector') || '[data-menu-row]';
    var layer = root.querySelector('[data-glide-layer]');
    function moveTo(target) {
      if (!(target instanceof Element)) return;
      var row = target.closest(sel);
      if (!row || !root.contains(row)) return;
      var cr = root.getBoundingClientRect();
      var rr = row.getBoundingClientRect();
      layer.style.top = (rr.top - cr.top) + 'px';
      layer.style.height = rr.height + 'px';
      layer.style.opacity = '1';
    }
    root.addEventListener('mouseover', function (event) { moveTo(event.target); });
    root.addEventListener('mouseleave', function () { layer.style.opacity = '0'; });
    root.addEventListener('focusin', function (event) { moveTo(event.target); });
    root.addEventListener('focusout', function (event) { if (!root.contains(event.relatedTarget)) layer.style.opacity = '0'; });
  }
  initGlide(host.querySelector('[data-glide-root]'));
  initGlide(recentsGlideRoot);

  /* ── recents rendering / filtering ── */
  function renderRecents() {
    var q = query.trim().toLowerCase();
    var visible = DEFAULT_RECENTS.filter(function (r) { return r.label.toLowerCase().indexOf(q) >= 0; });
    var html = visible.map(function (item) {
      return recentButton(item, item.label === activeTitle);
    }).join('');
    if (query && visible.length === 0) {
      html += '<div class="sidebar-copy mx-2 px-2 py-2 text-[12.5px] text-ink-3">No chats found</div>';
    }
    /* replace everything after the glide layer */
    var nodes = recentsGlideRoot.querySelectorAll(':scope > *:not([data-glide-layer])');
    for (var i = 0; i < nodes.length; i++) nodes[i].remove();
    recentsGlideRoot.insertAdjacentHTML('beforeend', html);
    recentsGlideRoot.querySelector('[data-glide-layer]').style.opacity = '0';
  }
  renderRecents();

  /* ── workspace menu (portal) ── */
  function workspaceMenuHTML(top, left) {
    function row(h, iconCls, icon, label, extra) {
      return '<button data-menu-row type="button" class="relative z-10 flex ' + h + ' w-full items-center gap-1.5 rounded-[8px] px-2 text-left">'
        + '<span class="' + iconCls + '">' + icon + '</span>'
        + '<span class="min-w-0 flex-1 truncate text-[13.5px] text-ink">' + label + '</span>'
        + (extra || '') + '</button>';
    }
    return '<div data-workspace-menu class="fixed z-50 w-64 rounded-[14px] bg-surface p-1.5 shadow-overlay" '
      + 'style="top:' + top + 'px;left:' + left + 'px;animation:pop-in 180ms cubic-bezier(0.23,1,0.32,1) both;transform-origin:top left">'
      + '<div data-glide-root data-row-selector="[data-menu-row]" class="relative flex flex-col gap-px">'
      +   '<span aria-hidden data-glide-layer class="pointer-events-none absolute inset-x-0 rounded-[8px] bg-hover-2" style="' + GLIDE_STYLE + '"></span>'
      +   '<button data-menu-row type="button" class="relative z-10 flex h-10 w-full items-center gap-1.5 rounded-[8px] px-2 text-left">'
      +     '<span class="flex size-6 shrink-0 items-center justify-center rounded-[7px] bg-ink text-[11px] font-semibold text-surface">' + WORKSPACE.monogram + '</span>'
      +     '<span class="min-w-0 flex-1 truncate text-[13.5px] font-medium text-ink">' + WORKSPACE.name + '</span>'
      +     '<span class="shrink-0 text-ink">' + I.check(18) + '</span>'
      +   '</button>'
      +   '<div class="my-1 h-px bg-line"></div>'
      +   row("h-9", "flex size-5 shrink-0 items-center justify-center text-ink-2", I.plus(16), "New workspace")
      +   row("h-9", "flex size-5 shrink-0 items-center justify-center text-ink-2", I.settings(16), "Workspace settings")
      +   row("h-9", "flex size-5 shrink-0 items-center justify-center text-ink-2", I.userAdd(16), "Invite team members")
      +   '<div class="my-1 h-px bg-line"></div>'
      +   row("h-9", "flex size-5 shrink-0 items-center justify-center text-ink-2", I.logOut(16), "Sign out")
      + '</div></div>';
  }

  function openWorkspace() {
    var trigger = host.querySelector('[data-workspace-trigger]');
    var rect = trigger.getBoundingClientRect();
    var div = document.createElement('div');
    div.innerHTML = workspaceMenuHTML(rect.bottom + 6, rect.left);
    var menu = div.firstChild;
    document.body.appendChild(menu);
    initGlide(menu.querySelector('[data-glide-root]'));
    workspaceOpen = true;
    trigger.setAttribute('aria-expanded', 'true');
  }
  function closeWorkspace() {
    var menu = document.querySelector('[data-workspace-menu]');
    if (menu) menu.remove();
    workspaceOpen = false;
    var trigger = host.querySelector('[data-workspace-trigger]');
    if (trigger) trigger.setAttribute('aria-expanded', 'false');
  }
  document.addEventListener('pointerdown', function (event) {
    if (!workspaceOpen) return;
    var t = event.target;
    if (!t.closest('[data-workspace-trigger]') && !t.closest('[data-workspace-menu]')) closeWorkspace();
  });

  /* ── collapse ── */
  function setCollapsed(next) {
    collapsed = next;
    aside.setAttribute('data-sidebar-collapsed', collapsed ? 'true' : 'false');
    aside.style.width = (collapsed ? SIDEBAR_MOTION.collapsedWidth : SIDEBAR_MOTION.expandedWidth) + 'px';
    var wb = host.querySelector('[data-workspace-trigger]');
    wb.setAttribute('aria-hidden', collapsed);
    wb.setAttribute('tabindex', collapsed ? '-1' : '0');
    var col = host.querySelector('[data-collapse]');
    col.setAttribute('aria-hidden', collapsed);
    col.setAttribute('tabindex', collapsed ? '-1' : '0');
    var exp = host.querySelector('[data-expand]');
    exp.setAttribute('aria-hidden', !collapsed);
    exp.setAttribute('tabindex', collapsed ? '0' : '-1');
  }
  host.querySelector('[data-workspace-trigger]').addEventListener('click', function () {
    if (workspaceOpen) closeWorkspace(); else openWorkspace();
  });
  host.querySelector('[data-collapse]').addEventListener('click', function () {
    closeWorkspace();
    setSearch(false);
    setCollapsed(true);
  });
  host.querySelector('[data-expand]').addEventListener('click', function () { setCollapsed(false); });

  /* ── chat search (CHAT_SEARCH_MOTION storyboard) ── */
  function setSearch(open) {
    searchOpen = open;
    var label = host.querySelector('[data-chats-label]');
    var openBtn = host.querySelector('[data-search-open]');
    var field = host.querySelector('[data-search-field]');
    label.className = 'absolute inset-0 flex items-center gap-1.5 px-2 text-[12.5px] font-medium text-ink-3 transition-[opacity,transform] ' + (open ? "pointer-events-none -translate-x-1 opacity-0" : "translate-x-0 opacity-100");
    label.setAttribute('aria-hidden', open);
    openBtn.className = 'absolute right-0 top-0 z-10 flex size-8 items-center justify-center rounded-[8px] text-ink-3 transition-[opacity,background-color,color,transform] hover:bg-hover-2 hover:text-ink active:scale-[0.96] ' + (open ? "pointer-events-none opacity-0" : "opacity-100");
    openBtn.setAttribute('aria-expanded', open);
    field.className = 'absolute right-0 top-0 z-20 flex h-8 items-center overflow-hidden rounded-[8px] bg-field text-ink-3 shadow-hairline transition-[width,opacity] focus-within:text-ink-2 ' + (open ? "pointer-events-auto opacity-100" : "pointer-events-none opacity-0");
    field.style.width = open ? '100%' : CHAT_SEARCH_MOTION.closedWidth + 'px';
    if (open) {
      var input = host.querySelector('[data-search-input]');
      input.focus();
    }
  }
  host.querySelector('[data-search-open]').addEventListener('click', function () { setSearch(true); });
  host.querySelector('[data-search-close]').addEventListener('click', function () {
    setSearch(false);
    query = "";
    host.querySelector('[data-search-input]').value = "";
    renderRecents();
  });
  var searchInput = host.querySelector('[data-search-input]');
  searchInput.addEventListener('input', function () { query = searchInput.value; renderRecents(); });
  searchInput.addEventListener('keydown', function (event) {
    if (event.key === 'Escape') {
      setSearch(false);
      query = "";
      searchInput.value = "";
      renderRecents();
    }
  });

  /* ── rail / recents click handling ── */
  host.querySelector('[data-rail-rows]').addEventListener('click', function (event) {
    var btn = event.target.closest('[data-row]');
    if (!btn) return;
    var navKey = btn.getAttribute('data-nav');
    if (navKey) currentNav = navKey;
    if (btn.getAttribute('data-nav') === null) currentNav = "chats"; /* New chat */
    if (btn.getAttribute('data-nav') === 'chats') activeTitle = null;
    /* re-render rail active states */
    railRows.innerHTML = railHTML();
    renderRecents();
  });
  /* keep the New chat button also selecting chats */
  recentsGlideRoot.addEventListener('click', function (event) {
    var btn = event.target.closest('[data-recent]');
    if (!btn) return;
    currentNav = "chats";
    activeTitle = btn.getAttribute('title');
    railRows.innerHTML = railHTML();
    renderRecents();
  });

  setCollapsed(false);
  setSearch(false);
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
