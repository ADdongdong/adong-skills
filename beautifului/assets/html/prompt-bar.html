/* ── minimal reset（替代 @import "tailwindcss"）─────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
  border: 0 solid;
}
html {
  -webkit-text-size-adjust: 100%;
  tab-size: 4;
}
body {

}

  margin: 0;
  padding: 0;
  list-style: none;
}
button, input, optgroup, select, textarea {
  margin: 0;
  padding: 0;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  background: transparent;
  border-radius: 0;
}
button, [type="button"], [type="reset"], [type="submit"] {

textarea {

}

  vertical-align: middle;
}

}
table {

  border-color: inherit;
  text-indent: 0;
}
a {

  text-decoration: inherit;
}
:disabled {

/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

/* ── primitive spacing system ─────────────────────────────

}

.primitive-card-bar {

}

.primitive-card-footer {

}

.primitive-table-cell {

}

  width: 28px;
  height: 28px;
  align-items: center;

  border-radius: var(--radius-control);
}

/* ── shared keyframes ─────────────────────────────────── */

@keyframes shimmer-text {
  from {
    background-position: 150% center;
  }
  to {
    background-position: -50% center;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* agent-screen — a static decorative cursor sitting on the capture (for show) */
.agent-cursor {
  position: absolute;
  pointer-events: none;

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

<!--@classes:

     变体：Rounded（圆角卡片）· Pill（全圆角药丸）
     ── glimm 降级（本件最关键的替换）────────────────────────────
     上游 import { createShader, playSweep, accentChain, ACCENTS } from "glimm"，
     用 WebGL 着色器在 composer 内部画一道彩虹扫光（选中旗舰模型时触发）。
     本移植件删掉该依赖，改为**原生 <canvas> 2D + requestAnimationFrame 自绘**：
       · 保真：触发时机（selectModel 里 key === "sprinkles-5" 才触发）、
               sweepMs 570 / outroMs 80 / peakAlpha 1.3 / easing easeOutExpo /
               bandTight 10（彩虹带密度）/ direction "ltr" / brightness 1.4（用 CSS filter 施加）/
               swellAmount 的纵向柔化 / 每次触发重建（uTime 归零）都照搬；
       · 降级：glimm 的 ACCENTS 调色板在离线环境不可得，按上游注释的意图
               （"Build a true full-spectrum rainbow instead"）内联 7 段全光谱彩虹；
               水平位移 + 纵向柔化的实现方式是自绘的，视觉近似着色器而非逐像素一致；
               waveSpeed 1.8 的波峰摆动简化掉（只保留纵向渐隐）。
     ── 其余保真 ─────────────────────────────────────────────────
     时序/尺寸逐字照搬：pop-in 180ms cubic-bezier(0.23,1,0.32,1)、
     glide 高亮 top/height 220ms + opacity 150ms、dictation 2200ms 后落字、
     附件 chip pop-in 200ms、eq-bounce 900ms 逐条 +150ms、textarea 28~100px 自动增高、
     parseToken 正则 /(^|\s)([@/])([\w-]*)$/、AUTO_STEPS 自跑演示的 hold 值。
     降级：React 状态 → 普通变量；useLayoutEffect 测量 → 直接读 offsetTop / getBoundingClientRect；
           行内 style 承载 grid 摆放（上游的 col-span-full 在本仓库的 Tailwind 子集编译器里
           会生成非法的 `span full`，故改用等价的 inline grid-column/row）。

  <p class="port-note">
    <strong>提示栏</strong> — Agent 的主输入编排器。输入 <code>@</code> 引来源（附件 / Scoop Data /
    Flavor records / Web search / Figma / Slack / Gmail，Gmail 行内可 Connect），输入 <code>/</code>
    叫命令（compare / churn-plan / restock …）。<code>↑ ↓</code> 选择、<code>Enter</code> 或
    <code>Tab</code> 落字、<code>Esc</code> 关菜单；回车发送、<code>Shift+Enter</code> 换行。
    右侧还有模型选择器（选旗舰模型会放一道彩虹扫光）、语音听写（2.2s 后落一段转写）与附件芯片。
    载入后会自跑一段演示，任意点击 / 按键即交还控制权。
  </p>

  <div class="port-variants" role="group" aria-label="变体">
    <button type="button" class="port-variant-btn" data-variant="Rounded" aria-pressed="true">Rounded</button>
    <button type="button" class="port-variant-btn" data-variant="Pill" aria-pressed="false">Pill</button>
  </div>

  <div id="pb-host" class="w-[420px] max-w-full">
    <div id="pb-root" data-promptbar class="flex min-h-[384px] w-full max-w-105 flex-col justify-end pb-8">
      <!-- composer 是锚点：菜单从它的上边缘向上生长 -->
      <div id="pb-anchor" class="relative">

        <div id="pb-composer" class="relative isolate flex flex-col overflow-hidden border border-line bg-surface shadow-card transition-[border-color,border-radius] duration-150 focus-within:border-line-strong gap-1.5 p-1.5 rounded-[14px]">
          <!-- 彩虹扫光：canvas 是替换元素，必须显式给宽高，否则不会跟着 inset-0 拉伸。
               brightness(1.4) 对应上游 playSweep 的 brightness 参数。 -->
          <canvas id="pb-canvas" aria-hidden="true" class="pointer-events-none absolute inset-0 -z-10 h-full w-full" style="border-radius:inherit;filter:brightness(1.4)"></canvas>
          <span id="pb-measure" aria-hidden="true" class="pointer-events-none absolute invisible whitespace-pre text-[13px] leading-[18px]"></span>

          <div id="pb-attachments" class="flex flex-wrap gap-1.5 pt-0.5 px-0.5" style="display:none"></div>

          <div id="pb-controls" class="grid items-end gap-x-1 gap-y-1.5">
            <button id="pb-plus" type="button" aria-label="Add attachments and sources" aria-expanded="false"
              class="flex size-7 shrink-0 items-center justify-center text-ink-3 transition-[background-color,color,transform] duration-150 hover:bg-hover hover:text-ink active:scale-[0.94] rounded-[8px]">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            </button>
            <textarea id="pb-input" rows="1" placeholder="Write a message…" aria-label="Prompt"
              class="min-h-7 px-1 py-[5px] text-[13px] leading-[18px] min-w-0 w-full resize-none bg-transparent text-ink outline-none [overflow-wrap:anywhere] placeholder:text-ink-3"></textarea>
            <button id="pb-model" type="button" aria-expanded="false" aria-label="Choose model"
              class="flex h-7 shrink-0 items-center gap-1 px-1.5 text-[12px] font-medium text-ink-2 transition-colors duration-150 hover:bg-hover hover:text-ink rounded-[8px]">
              <span id="pb-modelname">Vanilla 1</span>
              <span class="text-ink-3">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
              </span>
            </button>
            <button id="pb-dict" type="button" aria-label="Start dictation" aria-pressed="false"
              class="flex size-7 shrink-0 items-center justify-center transition-[background-color,color,transform] duration-150 active:scale-[0.94] rounded-[8px] text-ink-3 hover:bg-hover hover:text-ink"></button>
            <button id="pb-send" type="button" aria-label="Send" disabled
              class="flex size-7 shrink-0 items-center justify-center transition-[background-color,color,transform] duration-200 enabled:active:scale-[0.94] rounded-[8px]">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

        + '<button type="button" data-remove="' + i + '" aria-label="Remove ' + attachments[i] + '"'
        +   ' class="-my-1 flex size-6 items-center justify-center text-ink-3 transition-colors duration-100 hover:bg-line/70 hover:text-ink '
        +   (pill ? 'rounded-full' : 'rounded-[5px]') + '">'
        +   '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" /></svg>'
        + '</button></span>';
    }
    attachWrap.innerHTML = html;
  }
  attachWrap.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-remove]');
    if (!btn) return;
    e.stopPropagation();
    var idx = Number(btn.getAttribute('data-remove'));
    attachments = attachments.filter(function (_, j) { return j !== idx; });
    renderAttachments();
    syncSend();
  });

  /* ── 发送 ─────────────────────────────────────────────────── */
  function canSend() { return draft.trim().length > 0 || attachments.length > 0; }
  function syncSend() {
    var ok = canSend();
    sendBtn.disabled = !ok;
    sendBtn.style.background = ok ? 'var(--ink)' : 'var(--line-strong)';
    sendBtn.style.color = ok ? 'var(--surface)' : 'var(--ink-2)';
  }
  function send() {
    if (!canSend()) return;
    draft = '';
    attachments = [];
    closeMenus();
    input.value = '';
    renderAttachments();
    syncSend();
    syncAll();
  }
  function closeMenus() { plusOpen = false; modelOpen = false; }

  /* ── 落字（@ 来源 / / 命令）────────────────────────────────── */
  function pick(row) {
    var token = dismissed ? null : parseToken(draft);
    var source = sourceFor(row.key);
    if (source && source.attach) {
      attachments = attachments.concat([FILES[attachments.length % FILES.length]]);
      if (token) draft = draft.slice(0, token.start);
      renderAttachments();
    } else if (menu === 'at') {
      draft = (token ? draft.slice(0, token.start) : draft) + '@' + row.name + ' ';
    } else {
      draft = (token ? draft.slice(0, token.start) : draft) + row.name + ' ';
    }
    plusOpen = false;
    dismissed = false;
    input.value = draft;
    input.focus();
    syncAll();
  }

  /* ── 语音听写 ─────────────────────────────────────────────── */
  var MIC = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
    + '<g><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z" /><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3" /></g></svg>';
  function renderDictation() {
    if (listening) {
      dictBtn.className = 'flex size-7 shrink-0 items-center justify-center transition-[background-color,color,transform] duration-150 active:scale-[0.94] '
        + radiusCls() + ' bg-accent-tint text-accent-ink';
      var bars = '';
      for (var i = 0; i < 3; i++) {
        bars += '<span class="w-[2.5px] rounded-full bg-current" style="height:100%;animation:eq-bounce 900ms ease-in-out ' + (i * 150) + 'ms infinite"></span>';
      }
      dictBtn.innerHTML = '<span class="flex h-3.5 items-center gap-[2.5px]">' + bars + '</span>';
    } else {
      dictBtn.className = 'flex size-7 shrink-0 items-center justify-center transition-[background-color,color,transform] duration-150 active:scale-[0.94] '
        + radiusCls() + ' text-ink-3 hover:bg-hover hover:text-ink';
      dictBtn.innerHTML = MIC;
    }
    dictBtn.setAttribute('aria-pressed', listening ? 'true' : 'false');
    dictBtn.setAttribute('aria-label', listening ? 'Stop dictation' : 'Start dictation');
    input.placeholder = listening ? 'Listening\u2026' : 'Write a message\u2026';
  }
  dictBtn.addEventListener('click', function () {
    listening = !listening;
    renderDictation();
    if (listenTimer) { clearTimeout(listenTimer); listenTimer = null; }
    if (!listening) return;
    /* 上游：2200ms 后像真实转写一样落到输入框 */
    listenTimer = setTimeout(function () {
      listenTimer = null;
      var current = draft;
      draft = current ? (current.replace(/\s+$/, '') + ' ' + DICTATION) : DICTATION;
      listening = false;
      input.value = draft;
      renderDictation();
      input.focus();
      syncAll();
    }, 2200);
  });

  /* ── 统一同步 ─────────────────────────────────────────────── */
  function syncAll() {
    computeRows();
    renderMenu();
    applySizing();
    syncSend();
    renderModelMenu();
  }
  function syncMenuOnly() {
    computeRows();
    renderMenu();
  }

  /* ── 交互绑定 ─────────────────────────────────────────────── */
  /* 交还控制权：停掉演示循环；若用户第一次就瞄准输入框，清掉演示留下的草稿
   * （上游：if (auto && event.target === inputRef.current) setDraft("")）*/
  function takeOver(e) {
    var wasAuto = auto;
    auto = false;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    if (wasAuto && e.target === input) { draft = ''; input.value = ''; syncAll(); }
  }
  root.addEventListener('pointerdown', takeOver, true);
  root.addEventListener('keydown', takeOver, true);

  input.addEventListener('input', function () {
    draft = input.value;
    dismissed = false;
    plusOpen = false;
    syncAll();
  });
  input.addEventListener('keydown', function (e) {
    if (menu && rows.length > 0) {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        engaged = true;
        active = (active + (e.key === 'ArrowDown' ? 1 : rows.length - 1)) % rows.length;
        var panel = menuEl.querySelector('[data-panel]');
        if (panel) setRowBox(panel);
        return;
      }
      if ((e.key === 'Enter' && !e.shiftKey) || e.key === 'Tab') {
        e.preventDefault();
        pick(rows[active]);
        return;
      }
    }
    if (e.key === 'Escape') { dismissed = true; closeMenus(); syncMenuOnly(); renderModelMenu(); return; }
    /* 原生 KeyboardEvent 上就是 isComposing（上游 React 写的是 nativeEvent.isComposing）*/
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });

  plusBtn.addEventListener('click', function () {
    modelOpen = false;
    plusOpen = !plusOpen;
    input.focus();
    active = 0;
    engaged = false;
    syncMenuOnly();
    renderModelMenu();
  });
  sendBtn.addEventListener('click', send);
  modelBtn.addEventListener('click', function () {
    plusOpen = false;
    modelOpen = !modelOpen;
    if (!modelOpen) modelHovered = null;
    syncMenuOnly();
    renderModelMenu();
  });

  /* 点击 composer 之外任意处关闭菜单 */
  document.addEventListener('pointerdown', function (e) {
    if (!modelOpen && !plusOpen) return;
    var el = e.target;
    if (!(el instanceof Element) || !el.closest('[data-promptbar]')) {
      modelOpen = false;
      plusOpen = false;
      renderModelMenu();
      syncMenuOnly();
    }
  });

  /* ── 自跑演示：@ 菜单 → / 菜单 → 打开模型菜单并升级到旗舰 ──── */
  function runAuto() {
    if (!auto) return;
    var step = AUTO_STEPS[autoStep % AUTO_STEPS.length];
    draft = step.draft;
    input.value = draft;
    dismissed = false;
    if (step.connect !== undefined) connected = step.connect;
    if (step.modelOpen !== undefined) modelOpen = step.modelOpen;
    if (step.model) {
      var next = null;
      for (var i = 0; i < MODELS.length; i++) if (MODELS[i].key === step.model) next = MODELS[i];
      if (next) selectModel(next);
    }
    syncAll();
    /* 演示步里指定的高亮行：syncAll（等价上游 [menu,query] 效果）之后再落，
     * 这样高亮层像上游一样真的停在那一行上 */
    if (step.active !== undefined) { active = step.active; engaged = true; renderMenu(); }
    renderModelMenu();
    autoTimer = setTimeout(function () { autoStep++; runAuto(); }, step.hold);
  }

  /* ── 变体切换：等价于上游画廊的重新挂载 ───────────────────── */
  function reset(variant) {
    pill = variant === 'Pill';
    draft = ''; dismissed = false; plusOpen = false; modelOpen = false;
    model = MODELS[1]; attachments = []; connected = false; active = 0;
    listening = false; autoStep = 0; expanded = false; wide = false;
    engaged = false; modelHovered = null; rowBox = null; modelBox = null;
    menuKind = null; menuKey = null;
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
    if (listenTimer) { clearTimeout(listenTimer); listenTimer = null; }
    if (sweepRaf) { cancelAnimationFrame(sweepRaf); sweepRaf = 0; }
    sweeping = false;
    clearCanvas();
    input.value = '';
    modelName.textContent = model.name;
    renderDictation();
    renderAttachments();
    renderModelMenu();
    syncAll();
    auto = true;
    runAuto();
  }

  var variantBtns = document.querySelectorAll('.port-variant-btn');
  for (var v = 0; v < variantBtns.length; v++) {
    variantBtns[v].addEventListener('click', function () {
      for (var j = 0; j < variantBtns.length; j++) variantBtns[j].setAttribute('aria-pressed', 'false');
      this.setAttribute('aria-pressed', 'true');
      reset(this.getAttribute('data-variant'));
    });
  }

  reset('Rounded');
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
