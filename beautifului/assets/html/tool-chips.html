/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the

 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);

  display: flex;
  align-items: center;

  padding: 5px 9px;

  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;

  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {

  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {

  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);

           文件 diff 芯片的 hover 预览在上游是 createPortal(…, document.body) —— 即
           「渲染进 body 的浮层」，本移植用同样的做法（fixed 定位节点挂在 body，避免
           被父级 transform/动画重定义坐标），并按视口高度自动决定向上/向下翻转。
           const previewHeight = 38 + lines*19、x 夹在 [12, innerWidth-300]、上下 6px 间距、

    悬停任意一行会浮现 chevron 提示可展开；点击行展开该工具实际做了什么。
    悬停底部文件芯片弹出该文件的逐行 diff 预览（<code>+</code>/<code>−</code> 着色）。

};

/* ROWS：上游 ROWS 数组（演示数据保留，能体现布局） */
var TC_STEPS = [
  { icon: 'think', label: 'Thinking', chip: 'Planning the churn schedule…', mono: false, detailMono: false,
    detail: [
      { text: 'Weekend demand carries pistachio, so it churns first.' },
      { text: 'Batch capacity leaves two evening freezer windows.' }
    ] },
  { icon: 'write', label: 'Write 204 lines', chip: 'ChurnSchedule.tsx', mono: true, detailMono: true,
    detail: [
      { text: '+ const windows = slots.filter((s) => s.temp <= -12)', tone: 'add' },
      { text: '+ return schedule(windows, { hero: "pistachio" })', tone: 'add' }
    ] },
  { icon: 'run', label: 'Rebuild and verify', chip: 'npm run freeze', mono: true, detailMono: true,
    detail: [
      { text: '✓ built in 1.2s' },
      { text: '✓ 34 checks passed' }

  { icon: 'read', label: 'Read image', chip: 'flavor-chart.png', mono: true, detailMono: false,
    detail: [
      { text: '1280 × 720 · line chart, three summers.' },
      { text: 'Mint chip trends up 12% through July.' }
    ] }
];

var TC_DIFFS = [
  { file: 'flavors.css', add: 13, del: 0 },
  { file: 'ChurnSchedule.tsx', add: 74, del: 41 },
  { file: 'menu.ts', add: 8, del: 2 }
];

/* hovering a file chip opens its diff — green added, red removed */
var TC_DIFF_LINES = {
  'flavors.css': [
    { text: '.scoop-card {', tone: 'ctx' },
    { text: '  gap: 14px;', tone: 'del' },
    { text: '  gap: 12px;', tone: 'add' },
    { text: '  container-type: inline-size;', tone: 'add' },

  ],
  'ChurnSchedule.tsx': [
    { text: 'const slots = coldSlots(week);', tone: 'ctx' },
    { text: 'const windows = slots;', tone: 'del' },
    { text: 'const windows = slots.filter(', tone: 'add' },
    { text: '  (s) => s.temp <= -12,', tone: 'add' },

var TC_COPY = { header: '4 tool calls, 2 messages', more: '+2 more' };

(function () {
  var host = document.getElementById('toolchips-host');

  var step = 0;

  var openRows = {};

  host.innerHTML =
    '<div class="min-h-[220px] w-full max-w-80 pb-1">'

    +   '<span class="tabular-nums">' + TC_COPY.header + '</span>'
    + '</button>'
    /* collapsed run header 控制的行区域：grid-rows 1fr/0fr + opacity */
    + '<div id="tc-expand" class="grid transition-[grid-template-rows,opacity] duration-300" style="grid-template-rows:1fr;opacity:1">'
    +   '<div class="-mx-1 overflow-hidden px-1.5 pb-1">'
    +     '<div id="tc-rows" class="mt-1.5 flex flex-col gap-1"></div>'

  var rowsEl = document.getElementById('tc-rows');
  var chipsEl = document.getElementById('tc-chips');
  var expandEl = document.getElementById('tc-expand');
  var chevEl = document.getElementById('tc-hchev');

  /* body portal —— 上游 createPortal(..., document.body)。
     fixed 定位浮层挂在 body 下，不受外层 transform/动画影响。 */
  var portal = document.createElement('div');
  portal.id = 'tc-portal';
  document.body.appendChild(portal);

  function rowHtml(row, idx) {
    var fill = row.icon === 'think' ? 'currentColor' : 'none';
    var iconSvg = '<svg width="13" height="13" viewBox="0 0 24 24" fill="' + fill + '" stroke="currentColor" class="transition-opacity duration-100 group-hover/row:opacity-0">' + TC_ICONS[row.icon] + '</svg>';

    var lines = row.detail.map(function (l) {
      return '<span class="truncate text-[11.5px] leading-[1.6] '
        + (row.detailMono ? 'font-mono ' : '')

        + l.text + '</span>';
    }).join('');
    return '<div data-row="' + idx + '" style="animation:fade-up 300ms cubic-bezier(0.23,1,0.32,1) both">'
      + '<button type="button" aria-expanded="false" class="group/row -mx-[3px] flex h-7 w-[calc(100%_+_6px)] min-w-0 items-center gap-2 rounded-control px-[3px] text-left transition-colors duration-100 hover:bg-hover-2">'

      +     iconSvg + chevSvg
      +   '</span>'
      +   '<span class="shrink-0 text-[12.5px] font-medium text-ink">' + row.label + '</span>'
      +   '<span class="inline-flex h-5.5 min-w-0 flex-1 cursor-pointer items-center truncate rounded-chip bg-field px-1.5 text-[11.5px] text-ink-2 shadow-hairline transition-colors duration-100 hover:bg-hover-2 '
      +     (row.mono ? 'font-mono' : '') + '">' + row.chip + '</span>'
      + '</button>'
      + '<div class="grid transition-[grid-template-rows,opacity] duration-300" style="grid-template-rows:0fr;opacity:0;transition-timing-function:cubic-bezier(0.23, 1, 0.32, 1)">'
      +   '<div class="min-h-0 overflow-hidden">'
      +     '<div class="mt-0.5 mb-1 ml-2 flex flex-col gap-0.5 border-l border-line py-0.5 pl-3.5">' + lines + '</div>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }

  function addRow(idx) {
    var wrap = document.createElement('div');
    wrap.innerHTML = rowHtml(TC_STEPS[idx], idx);
    var node = wrap.firstChild;
    rowsEl.appendChild(node);
    var btn = node.querySelector('button');
    btn.addEventListener('click', function () { toggleRow(idx, node); });
  }

  function toggleRow(idx, node) {
    var on = !openRows[idx];
    openRows[idx] = on;
    var btn = node.querySelector('button');
    btn.setAttribute('aria-expanded', on ? 'true' : 'false');
    var detail = node.lastElementChild;
    detail.style.gridTemplateRows = on ? '1fr' : '0fr';
    detail.style.opacity = on ? '1' : '0';
    var iconSvg = node.querySelector('button > span > svg:first-child');
    var chevSvg = node.querySelector('button > span > svg:last-child');
    iconSvg.classList.toggle('opacity-0', on);
    chevSvg.classList.toggle('opacity-0', !on);
    chevSvg.classList.toggle('opacity-100', on);
    chevSvg.style.transform = on ? 'rotate(0deg)' : 'rotate(-90deg)';
  }

  function chipsHtml() {
    var out = '<div class="mt-2.5 flex max-w-full flex-wrap gap-1.5 border-t border-line pt-2.5">';
    TC_DIFFS.forEach(function (d, i) {
      out += '<span class="relative" data-diffchip data-file="' + d.file + '">'
        + '<button type="button" aria-expanded="false" aria-label="Show diff for ' + d.file + '" class="inline-flex h-7 max-w-full items-center gap-2 rounded-chip bg-surface px-2 font-mono text-[11.5px] text-ink shadow-btn transition-colors duration-100 hover:bg-hover" style="animation:pop-in 250ms cubic-bezier(0.23,1,0.32,1) ' + (i * 80) + 'ms both">'
        +   '<span class="min-w-0 truncate">' + d.file + '</span>'
        +   '<span class="shrink-0 text-green tabular-nums">+' + d.add + '</span>'
        +   (d.del > 0 ? '<span class="shrink-0 text-red tabular-nums">−' + d.del + '</span>' : '')
        + '</button>'
        + '</span>';
    });
    out += '<button type="button" class="inline-flex h-7 items-center rounded-chip px-1.5 font-mono text-[11.5px] text-ink-3 underline decoration-transparent underline-offset-2 transition-colors duration-100 hover:text-ink-2 hover:decoration-current" style="animation:fade-in 300ms ease-out ' + (TC_DIFFS.length * 80) + 'ms both">' + TC_COPY.more + '</button>';
    out += '</div>';
    return out;
  }

  function findDiff(file) {
    for (var i = 0; i < TC_DIFFS.length; i++) if (TC_DIFFS[i].file === file) return TC_DIFFS[i];
    return { add: 0, del: 0 };
  }

  var currentPreview = null;

  function renderPreview(file, x, pos, fitsBelow) {
    var d = findDiff(file);
    var lines = TC_DIFF_LINES[file] || [];
    var stat = '<span class="text-green">+' + d.add + '</span>'
      + (d.del > 0 ? '<span class="text-red"> −' + d.del + '</span>' : '');
    var body = lines.map(function (line) {
      var tone = line.tone === 'add' ? 'bg-green-tint text-green'
        : line.tone === 'del' ? 'bg-red-tint text-red' : 'text-ink-2';
      var sign = line.tone === 'add' ? '+' : line.tone === 'del' ? '−' : ' ';
      return '<div class="flex gap-2 px-2.5 whitespace-pre ' + tone + '">'
        + '<span class="w-3 shrink-0 select-none">' + sign + '</span>'
        + '<span class="min-w-0 truncate">' + line.text + '</span>'
        + '</div>';
    }).join('');
    portal.innerHTML =
      '<div class="fixed z-50 w-72 overflow-hidden rounded-[10px] bg-surface shadow-overlay" style="'
      + 'left:' + x + 'px;'
      + (fitsBelow ? 'top:' + pos + 'px;' : 'bottom:' + pos + 'px;')
      + 'animation:pop-in 160ms cubic-bezier(0.23,1,0.32,1) both;'
      + 'transform-origin:' + (fitsBelow ? 'top left' : 'bottom left') + '">'
      +   '<div class="flex items-center justify-between border-b border-line px-2.5 py-1.5 font-mono text-[11px]">'
      +     '<span class="min-w-0 truncate text-ink-2">' + file + '</span>'
      +     '<span class="shrink-0 tabular-nums">' + stat + '</span>'
      +   '</div>'
      +   '<div class="py-1 font-mono text-[11px] leading-[1.8]">' + body + '</div>'
      + '</div>';
  }

  function openPreview(file, currentTarget) {
    var chip = currentTarget.closest('[data-diffchip]');
    if (!chip) return;
    var rect = chip.getBoundingClientRect();
    var lines = TC_DIFF_LINES[file] || [];
    var previewHeight = 38 + lines.length * 19;
    var fitsBelow = rect.bottom + 6 + previewHeight <= window.innerHeight - 12;
    var x = Math.max(12, Math.min(rect.left, window.innerWidth - 300));
    var pos = fitsBelow ? rect.bottom + 6 : window.innerHeight - rect.top + 6;
    currentPreview = file;
    var btn = chip.querySelector('button');
    if (btn) btn.setAttribute('aria-expanded', 'true');
    renderPreview(file, x, pos, fitsBelow);
  }

  function closePreview(file) {
    if (currentPreview === file) {
      currentPreview = null;
      portal.innerHTML = '';
    }
    var chip = chipsEl.querySelector('[data-diffchip][data-file="' + file + '"]');
    if (chip) {
      var btn = chip.querySelector('button');
      if (btn) btn.setAttribute('aria-expanded', 'false');
    }
  }

  function showChips() {
    chipsEl.innerHTML = chipsHtml();
    var wrappers = chipsEl.querySelectorAll('[data-diffchip]');
    for (var i = 0; i < wrappers.length; i++) {
      (function (wrap) {
        var file = wrap.getAttribute('data-file');
        var btn = wrap.querySelector('button');
        wrap.addEventListener('mouseenter', function () { openPreview(file, wrap); });
        wrap.addEventListener('mouseleave', function () { closePreview(file); });
        btn.addEventListener('focus', function () { openPreview(file, wrap); });
        btn.addEventListener('blur', function () { closePreview(file); });
      })(wrappers[i]);
    }
  }

  function tick() {
    if (step >= total) return;
    setTimeout(function () {
      step += 1;
      if (step <= TC_STEPS.length) addRow(step - 1);
      if (step >= total) showChips();
      tick();
    }, TC_STEP_MS);
  }

  document.getElementById('tc-header').addEventListener('click', function () {
    open = !open;
    this.setAttribute('aria-expanded', open ? 'true' : 'false');
    expandEl.style.gridTemplateRows = open ? '1fr' : '0fr';
    expandEl.style.opacity = open ? '1' : '0';
    chevEl.style.transform = open ? 'rotate(0deg)' : 'rotate(-90deg)';
  });

  tick();
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
