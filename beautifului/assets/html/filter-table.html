/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

}

  }

  }
}

@keyframes fade-up {
  from {
    opacity: 0;

  }

    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── 工具类（Tailwind 子集，由 twsubset.py 编译）───────────────
 * 颜色/圆角/阴影/缓动全部引用同名 var(--token)，
 * 因此配色与动效曲线与官网一致。
 * 选择器一律写成 [class~=] 属性形式而非转义类名：
 * 工具类含斜杠、冒号、方括号、百分号，转义极易出错。
 */

[class~="transition-[background-color,box-shadow,color]"] {
  transition-property: background-color,box-shadow,color;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-[grid-template-rows,opacity]"] {
  transition-property: grid-template-rows,opacity;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-colors"] {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="duration-100"] {
  transition-duration: 100ms;
}

[class~="duration-200"] {
  transition-duration: 200ms;
}

[class~="duration-300"] {
  transition-duration: 300ms;
}

[class~="-mx-1"] {
  margin-left: calc(0.25rem * -1);
  margin-right: calc(0.25rem * -1);
}

[class~="bg-field"] {
  background-color: var(--field);
}

[class~="bg-surface"] {
  background-color: var(--surface);
}

[class~="border"] {
  border-width: 1px;
  border-style: solid;
}

[class~="border-[var(--grid-line)]"] {
  border-color: var(--grid-line);
  border-style: solid;
}

[class~="border-b"] {
  border-bottom-width: 1px;
  border-style: solid;
}

[class~="border-r"] {
  border-right-width: 1px;
  border-style: solid;
}

[class~="flex"] {
  display: flex;
}

[class~="font-medium"] {
  font-weight: 500;
}

[class~="gap-1"] {
  gap: 0.25rem;
}

[class~="gap-1.5"] {
  gap: 0.375rem;
}

[class~="grid"] {
  display: grid;
}

[class~="grid-cols-[minmax(0,1.3fr)_minmax(0,0.6fr)_minmax(0,0.95fr)_minmax(0,0.9fr)]"] {
  grid-template-columns: minmax(0,1.3fr) minmax(0,0.6fr) minmax(0,0.95fr) minmax(0,0.9fr);
}

[class~="h-6.5"] {
  height: 1.625rem;
}

[class~="h-[23px]"] {
  height: 23px;
}

[class~="hover:bg-hover"]:hover {
  background-color: var(--hover);
}

[class~="inline-flex"] {
  display: inline-flex;
}

[class~="items-center"] {
  align-items: center;
}

[class~="max-w-105"] {
  max-width: 26.25rem;
}

[class~="mb-1"] {
  margin-bottom: 0.25rem;
}

[class~="min-w-0"] {
  min-width: 0rem;
}

[class~="min-w-[420px]"] {
  min-width: 420px;
}

[class~="overflow-hidden"] {
  overflow: hidden;
}

[class~="overflow-x-auto"] {
  overflow-x: auto;
}

[class~="px-1"] {
  padding-left: 0.25rem;
  padding-right: 0.25rem;
}

[class~="px-2.5"] {
  padding-left: 0.625rem;
  padding-right: 0.625rem;
}

[class~="px-3"] {
  padding-left: 0.75rem;
  padding-right: 0.75rem;
}

[class~="px-[7px]"] {
  padding-left: 7px;
  padding-right: 7px;
}

[class~="py-1"] {
  padding-top: 0.25rem;
  padding-bottom: 0.25rem;
}

[class~="py-2"] {
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
}

[class~="rounded-[4px]"] {
  border-radius: 4px;
}

[class~="rounded-[8px]"] {
  border-radius: 8px;
}

[class~="rounded-card"] {
  border-radius: var(--radius-card);
}

[class~="rounded-full"] {
  border-radius: 9999px;
}

[class~="shadow-btn"] {
  box-shadow: var(--shadow-btn);
}

[class~="shadow-card"] {
  box-shadow: var(--shadow-card);
}

[class~="shrink-0"] {
  flex-shrink: 0;
}

[class~="size-1.5"] {
  width: 0.375rem;
  height: 0.375rem;
}

[class~="tabular-nums"] {
  font-variant-numeric: tabular-nums;
}

[class~="text-[10.5px]"] {
  font-size: 10.5px;
}

[class~="text-[12.5px]"] {
  font-size: 12.5px;
}

[class~="text-[12px]"] {
  font-size: 12px;
}

[class~="text-[13px]"] {
  font-size: 13px;
}

[class~="text-ink"] {
  color: var(--ink);
}

[class~="text-ink-2"] {
  color: var(--ink-2);
}

[class~="text-ink-3"] {
  color: var(--ink-3);
}

[class~="truncate"] {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

[class~="w-full"] {
  width: 100%;
}

[class~="whitespace-nowrap"] {
  white-space: nowrap;
}

</style>
</head>
<body>
<div class="port-stage">
<!-- title: Filter Table -->
<!--@classes:
  w-full max-w-105
  -mx-1 mb-1 flex items-center gap-1 overflow-x-auto px-1 py-1
  flex h-6.5 shrink-0 items-center gap-1.5 rounded-full px-2.5 text-[12px] font-medium transition-[background-color,box-shadow,color] duration-200
  bg-surface text-ink shadow-btn text-ink-2 hover:bg-hover
  size-1.5 rounded-full
  rounded-[4px] px-1 text-[10.5px] tabular-nums bg-field text-ink-2 text-ink-3
  overflow-x-auto rounded-card bg-surface shadow-card
  min-w-[420px]
  grid grid-cols-[minmax(0,1.3fr)_minmax(0,0.6fr)_minmax(0,0.95fr)_minmax(0,0.9fr)] border-b border-[var(--grid-line)] text-[12.5px] font-medium text-ink-2
  border-r border-[var(--grid-line)] px-3 py-2
  grid transition-[grid-template-rows,opacity] duration-300 overflow-hidden
  border-b border-[var(--grid-line)] text-[13px] transition-colors duration-100 hover:bg-hover
  flex min-w-0 items-center border-r border-[var(--grid-line)] px-3 py-2
  truncate font-medium text-ink
  flex items-center whitespace-nowrap border-r border-[var(--grid-line)] px-3 py-2 text-ink-2 tabular-nums
  inline-flex h-[23px] shrink-0 items-center whitespace-nowrap rounded-[8px] border px-[7px] text-[13px] font-medium
  flex min-w-0 items-center px-3 py-2 text-ink-2 truncate
-->
<!-- 来源：components/primitives/FilterTable.tsx（上游 MIT）
     保真：状态芯片即时筛选行。每行是 grid-template-rows 1fr↔0fr + opacity 的
           300ms 展开/收起（strong 曲线 cubic-bezier(0.23,1,0.32,1)），不整表重排。
           芯片激活态 bg-surface text-ink shadow-btn，未激活 text-ink-2 hover:bg-hover；
           计数角标激活 bg-field、未激活 text-ink-3。筛选点用上游硬编码 hex
           （#f09a2f / #16a6c7 / #25a878），状态药丸用 foundation 的
           .filter-status-todo/-progress/-done（其色由 --tag-base 经 color-mix 派生，
           明暗两套自动切换）。表格 DOM 与 grid 列宽保持上游原样。 -->
<div class="port-frame">
  <p class="port-note">
    <strong>筛选表格</strong> — 状态芯片直接筛选任务表。点 <code>All / To do / In Progress /
    Completed</code> 冷切换，命中的行实时展开、其余收起（300ms 强曲线），芯片与计数角标同步高亮。
    状态药丸走 <code>.filter-status-*</code>，其颜色由 <code>--tag-base</code> 经
    <code>color-mix</code> 派生，浅色/暗色各一套。
  </p>
  <div id="filter-table-host"></div>
</div>

<script>
/* ── 上游常量 1:1 ──────────────────────────────────────────── */
var FT_FILTERS = [
  { key: 'all', label: 'All', count: 5 },
  { key: 'todo', label: 'To do', dot: '#f09a2f', count: 2 },
  { key: 'progress', label: 'In Progress', dot: '#16a6c7', count: 2 },
  { key: 'done', label: 'Completed', dot: '#25a878', count: 1 }
];

var FT_ROWS = [
  { task: 'Restock mango sorbet', date: 'Dec 03', status: 'todo', owner: 'Mango Moon Gelato' },
  { task: 'Churn black sesame', date: 'Sep 22', status: 'progress', owner: 'Kumo Creamery' },
  { task: 'Print summer menu', date: 'Jan 02', status: 'todo', owner: 'Coral Coast Sorbet' },
  { task: 'Taste-test batch 42', date: 'Nov 08', status: 'progress', owner: 'Maple Orbit' },
  { task: 'Order waffle cones', date: 'Apr 14', status: 'done', owner: 'Aurora Scoops' }
];

var FT_COLS = { task: 'Task name', date: 'Date', status: 'Status', owner: 'Advisor' };

var FT_PILLS = {
  todo: { label: 'To do', cls: 'filter-status-todo' },
  progress: { label: 'In Progress', cls: 'filter-status-progress' },
  done: { label: 'Completed', cls: 'filter-status-done' }
};

var FT_GRID = 'grid grid-cols-[minmax(0,1.3fr)_minmax(0,0.6fr)_minmax(0,0.95fr)_minmax(0,0.9fr)]';

(function () {
  var host = document.getElementById('filter-table-host');
  var filter = 'all';

  var chipsHtml = FT_FILTERS.map(function (f) {
    var active = f.key === 'all';
    return '<button type="button" data-chip="' + f.key + '" aria-pressed="' + (active ? 'true' : 'false') + '" class="flex h-6.5 shrink-0 items-center gap-1.5 rounded-full px-2.5 text-[12px] font-medium transition-[background-color,box-shadow,color] duration-200 '
      + (active ? 'bg-surface text-ink shadow-btn' : 'text-ink-2 hover:bg-hover') + '">'
      + (f.dot ? '<span class="size-1.5 rounded-full" style="background:' + f.dot + '"></span>' : '')
      + f.label
      + '<span data-count class="rounded-[4px] px-1 text-[10.5px] tabular-nums ' + (active ? 'bg-field text-ink-2' : 'text-ink-3') + '">' + f.count + '</span>'
      + '</button>';
  }).join('');

  var headHtml = '<div class="' + FT_GRID + ' border-b border-[var(--grid-line)] text-[12.5px] font-medium text-ink-2">'
    + '<span class="border-r border-[var(--grid-line)] px-3 py-2">' + FT_COLS.task + '</span>'
    + '<span class="border-r border-[var(--grid-line)] px-3 py-2">' + FT_COLS.date + '</span>'
    + '<span class="border-r border-[var(--grid-line)] px-3 py-2">' + FT_COLS.status + '</span>'
    + '<span class="px-3 py-2">' + FT_COLS.owner + '</span>'
    + '</div>';

  var rowsHtml = FT_ROWS.map(function (row, i) {
    var pill = FT_PILLS[row.status];
    return '<div data-row="' + i + '" class="grid transition-[grid-template-rows,opacity] duration-300" style="grid-template-rows:1fr;opacity:1;transition-timing-function:cubic-bezier(0.23, 1, 0.32, 1)">'
      + '<div class="overflow-hidden">'
      +   '<div class="' + FT_GRID + ' border-b border-[var(--grid-line)] text-[13px] transition-colors duration-100 hover:bg-hover">'
      +     '<span class="flex min-w-0 items-center border-r border-[var(--grid-line)] px-3 py-2"><span class="truncate font-medium text-ink">' + row.task + '</span></span>'
      +     '<span class="flex items-center whitespace-nowrap border-r border-[var(--grid-line)] px-3 py-2 text-ink-2 tabular-nums">' + row.date + '</span>'
      +     '<span class="flex items-center border-r border-[var(--grid-line)] px-3 py-2"><span class="inline-flex h-[23px] shrink-0 items-center whitespace-nowrap rounded-[8px] border px-[7px] text-[13px] font-medium ' + pill.cls + '">' + pill.label + '</span></span>'
      +     '<span class="flex min-w-0 items-center px-3 py-2 text-ink-2"><span class="truncate">' + row.owner + '</span></span>'
      +   '</div>'
      + '</div>'
      + '</div>';
  }).join('');

  host.innerHTML =
    '<div class="w-full max-w-105">'
    + '<div class="-mx-1 mb-1 flex items-center gap-1 overflow-x-auto px-1 py-1" style="scrollbar-width:none">' + chipsHtml + '</div>'
    + '<div aria-label="Scrollable task table" class="overflow-x-auto rounded-card bg-surface shadow-card" role="region" tabindex="0" style="scrollbar-width:none">'
    +   '<div class="min-w-[420px]">' + headHtml + rowsHtml + '</div>'
    + '</div>'
    + '</div>';

  function setFilter(key) {
    filter = key;
    /* chips */
    var chips = host.querySelectorAll('[data-chip]');
    for (var c = 0; c < chips.length; c++) {
      var chip = chips[c];
      var active = chip.getAttribute('data-chip') === key;
      chip.setAttribute('aria-pressed', active ? 'true' : 'false');
      chip.classList.toggle('bg-surface', active);
      chip.classList.toggle('text-ink', active);
      chip.classList.toggle('shadow-btn', active);
      chip.classList.toggle('text-ink-2', !active);
      chip.classList.toggle('hover:bg-hover', !active);
      var count = chip.querySelector('[data-count]');
      count.classList.toggle('bg-field', active);
      count.classList.toggle('text-ink-2', active);
      count.classList.toggle('text-ink-3', !active);
    }
    /* rows */
    var rows = host.querySelectorAll('[data-row]');
    for (var i = 0; i < rows.length; i++) {
      var shown = key === 'all' || FT_ROWS[i].status === key;
      var wrap = rows[i];
      wrap.style.gridTemplateRows = shown ? '1fr' : '0fr';
      wrap.style.opacity = shown ? '1' : '0';
    }
  }

  var chips = host.querySelectorAll('[data-chip]');
  for (var i = 0; i < chips.length; i++) {
    chips[i].addEventListener('click', function () {
      setFilter(this.getAttribute('data-chip'));
    });
  }

  setFilter('all');
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
