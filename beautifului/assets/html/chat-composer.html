/* ── minimal reset（替代 @import "tailwindcss"）─────────────── */
*,

  border: 0 solid;

  tab-size: 4;

  list-style: none;
}

  color: inherit;
  font: inherit;
  letter-spacing: inherit;

  border-color: inherit;

/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

}

}

  }
  to {
    background-position: -50% center;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── 工具类（Tailwind 子集，由 twsubset.py 编译）───────────────
 * 颜色/圆角/阴影/缓动全部引用同名 var(--token)，
 * 因此配色与动效曲线与官网一致。
 * 选择器一律写成 [class~=] 属性形式而非转义类名：
 * 工具类含斜杠、冒号、方括号、百分号，转义极易出错。
 */

[class~="transition-[background-color,color,transform]"] {
  transition-property: background-color,color,transform;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-[background-color,opacity]"] {

  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-[border-color,box-shadow]"] {

}

[class~="transition-[opacity,filter,transform]"] {
  transition-property: opacity,filter,transform;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-[opacity,transform]"] {
  transition-property: opacity,transform;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-colors"] {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);

}

}

}

}

}

}

  align-self: flex-start;
}

[class~="shadow-[0_1px_2px_rgba(0,0,0,0.035)]"] {
  box-shadow: 0 1px 2px rgba(0,0,0,0.035);
}

  box-shadow: var(--shadow-card);
}

  flex-shrink: 0;
}

  width: 1.5rem;
  height: 1.5rem;
}

  width: 1.75rem;
  height: 1.75rem;
}

[class~="text-[12px]"] {
  font-size: 12px;
}

[class~="text-[13px]"] {
  font-size: 13px;
}

[class~="text-ink"] {
  color: var(--ink);
}

[class~="text-ink-2"] {
  color: var(--ink-2);
}

[class~="text-ink-3"] {
  color: var(--ink-3);
}

[class~="w-[380px]"] {
  width: 380px;
}

[class~="w-full"] {
  width: 100%;
}

</style>
</head>
<body>
<div class="port-stage">
<!-- title: Chat -->
<!--@classes: bg-field opacity-50 hover:opacity-75-->
<!-- 来源：components/primitives/ChatComposer.tsx（上游 MIT）
     保真：phase 状态机 sent →(500ms) reply1 →(1400ms) reply2 →(1200ms) done 逐字照搬；
           气泡 transition-[opacity,transform] duration-300、Section 的
           opacity/filter/transform + duration-400 + cubic-bezier(0.23,1,0.32,1)、
           fade-up 400ms 入场动画、DOM 层级与全部工具类均与上游一致。
     降级：useState/useEffect → 普通变量 + setTimeout；Section 用 display 显隐 +
           重放 fade-up（上游靠 React 复用节点，只在新挂载时播一次动画），
           所以同一次对话里每段回复只会入场一次，视觉与上游等价。
     @classes 里是标签页激活态的分支类，它们是 JS 三元产生的，不在静态 class 属性里。-->

<div class="port-frame">
  <p class="port-note">
    <strong>聊天面板</strong> — 带标签页的 Agent 对话区：顶部 <code>Flavors / Suppliers</code> 切换上下文，
    中间是按序落地的两段推理回复（每段自带 label / sub / 耗时），底部是钉在卡片底部的输入 composer。
    发送一段新问题会重放整条回复序列；卡片高度固定 <code>h-[288px]</code>，所以内容区滚动而外壳不抖。
  </p>

  <!-- 宿主给一个显式宽度：上游卡片是 `w-full max-w-95`（380px），
       而 .port-frame 是 shrink-to-fit 的，不给定宽的话 w-full 会被内容量成 342px。 -->
  <div class="w-[380px] max-w-full">
  <div class="flex h-[288px] w-full max-w-95 flex-col self-start overflow-hidden rounded-[14px] bg-surface shadow-card">
    <!-- header — tabs + actions -->
    <div class="flex shrink-0 items-center justify-between border-b border-line p-1.5">
      <div class="flex items-center" role="group" aria-label="上下文标签">
        <button type="button" data-tab="Flavors" aria-pressed="true"
          class="rounded-[6px] px-2 py-[3px] text-[13px] text-ink transition-[background-color,opacity] duration-100 bg-field">Flavors</button>
        <button type="button" data-tab="Suppliers" aria-pressed="false"
          class="rounded-[6px] px-2 py-[3px] text-[13px] text-ink transition-[background-color,opacity] duration-100 opacity-50 hover:opacity-75">Suppliers</button>
      </div>
      <div class="flex items-center gap-1">
        <button type="button" aria-label="Action"
          class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover hover:text-ink-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button type="button" aria-label="Action"
          class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover hover:text-ink-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" />
          </svg>
        </button>
        <button type="button" aria-label="Action"
          class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover hover:text-ink-2">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <g fill="currentColor" stroke="none"><circle cx="5" cy="12" r="1.8" /><circle cx="12" cy="12" r="1.8" /><circle cx="19" cy="12" r="1.8" /></g>
          </svg>
        </button>
      </div>
    </div>

    <!-- conversation — fixed region so the card never changes shape -->
    <div id="cc-thread" class="flex min-h-0 flex-1 flex-col gap-2.5 overflow-y-auto px-3 pt-2.5 pb-1"></div>

    <!-- composer -->
    <div class="mt-auto shrink-0 p-1.5">
      <div id="cc-composer" role="presentation"
        class="flex cursor-text flex-col gap-2 rounded-control border border-line bg-field p-2.5 shadow-[0_1px_2px_rgba(0,0,0,0.035)] transition-[border-color,box-shadow] duration-150 focus-within:border-line-strong focus-within:shadow-[0_1px_2px_rgba(0,0,0,0.025)]">
        <input id="cc-input" type="text" value="" placeholder="Prompt or tag a flavor with @" aria-label="Chat prompt"
          class="min-h-4.5 bg-transparent text-[13px] leading-[1.4] text-ink outline-none placeholder:text-ink-3" />
        <div class="flex items-center justify-end">
          <button id="cc-send" type="button" aria-label="Send" disabled
            class="flex size-7 items-center justify-center rounded-[8px] transition-[background-color,color,transform] duration-200 enabled:active:scale-[0.96]">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 19V5M5 12l7-7 7 7" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  </div>
</div>

<script>
/* ── 逐字照搬上游的脚本化回复与默认文案 ───────────────────────── */
var MESSAGES = [
  { label: "Sales History", sub: "Flavor Data", time: "4s", body: "Pulled 3 summers of mint chip sales for comparison." },
  { label: "Comparison",    sub: "Trend Detection", time: "2s", body: "Mint chip is up 12% with stronger weekend peaks." }
];
var INITIAL_PROMPT = "Compare mint chip to last summer";
/* 上游 useEffect 的三段延时：sent 500 / reply1 1400 / reply2 1200 → done */
var PHASE_NEXT = {
  sent:   { next: "reply1", ms: 500 },
  reply1: { next: "reply2", ms: 1400 },
  reply2: { next: "done",   ms: 1200 }
};

(function () {
  var thread = document.getElementById('cc-thread');
  var input = document.getElementById('cc-input');
  var sendBtn = document.getElementById('cc-send');
  var composer = document.getElementById('cc-composer');
  var phase = 'done';
  var draft = '';
  var submitted = INITIAL_PROMPT;
  var tab = 'Flavors';
  var timer = null;

  /* ── thread：气泡 + 两个 Section 槽位，只建一次 ────────────── */
  function sectionHTML(m) {
    return '<div class="flex items-center gap-1 text-[12px] leading-[1.3]">'
         +   '<span class="font-medium text-ink">' + m.label + '</span>'
         +   '<span class="text-ink-2">' + m.sub + '</span>'
         +   '<span class="text-ink">for ' + m.time + '</span>'
         + '</div>'
         + '<p class="text-[13px] leading-normal text-ink">' + m.body + '</p>';
  }
  /* opacity/filter/transform + duration-400 + 强曲线 + fade-up 入场，均照上游 */
  function secSlot(i) {
    return '<div data-sec="' + i + '" style="display:none"'
         + ' class="flex w-full flex-col gap-1.5 transition-[opacity,filter,transform] duration-400">'
         + sectionHTML(MESSAGES[i])
         + '</div>';
  }
  thread.innerHTML =
      '<div class="flex justify-end pl-14">'
    +   '<div id="cc-bubble" class="rounded-xl bg-field px-3 py-1.5 text-[13px] leading-[1.4] text-ink transition-[opacity,transform] duration-300">'
    +     submitted
    +   '</div>'
    + '</div>'
    + secSlot(0) + secSlot(1);

  var bubble = document.getElementById('cc-bubble');
  var secs = [thread.querySelector('[data-sec="0"]'), thread.querySelector('[data-sec="1"]')];

  function styleSection(el, resolving) {
    el.style.transitionTimingFunction = 'cubic-bezier(0.23, 1, 0.32, 1)';
    el.style.transformOrigin = 'top left';
    el.style.opacity = resolving ? '0.55' : '1';
    el.style.filter = resolving ? 'blur(0.5px)' : 'blur(0)';
    el.style.transform = resolving ? 'scale(0.985)' : 'scale(1)';
  }
  function setSection(el, show, resolving) {
    var wasShown = el.style.display !== 'none';
    el.style.display = show ? '' : 'none';
    if (show && !wasShown) {
      /* 相当于 React 重新挂载：重放 fade-up 400ms */
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = 'fade-up 400ms cubic-bezier(0.23,1,0.32,1) both';
    }
    styleSection(el, resolving);
  }
  function apply(p) {
    var show1 = p === 'reply1' || p === 'reply2' || p === 'done';
    var show2 = p === 'reply2' || p === 'done';
    setSection(secs[0], show1, false);
    setSection(secs[1], show2, p === 'reply2');
  }
  function setPhase(p) {
    phase = p;
    apply(p);
    if (timer) clearTimeout(timer);
    var step = PHASE_NEXT[p];
    if (step) timer = setTimeout(function () { setPhase(step.next); }, step.ms);
  }

  /* ── composer ─────────────────────────────────────────────── */
  function canSend() { return draft.trim().length > 0; }
  function paintSend() {
    var ok = canSend();
    sendBtn.disabled = !ok;
    sendBtn.style.background = ok ? 'var(--ink)' : 'var(--line-strong)';
    sendBtn.style.color = ok ? 'var(--surface)' : 'var(--ink-2)';
  }
  function send() {
    if (!canSend()) return;
    submitted = draft.trim();
    bubble.textContent = submitted;
    draft = '';
    input.value = '';
    paintSend();
    setPhase('sent');
  }

  input.addEventListener('input', function () { draft = input.value; paintSend(); });
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') send(); });
  sendBtn.addEventListener('click', send);
  composer.addEventListener('click', function () { input.focus(); });

  /* ── header tabs ──────────────────────────────────────────── */
  var tabBtns = document.querySelectorAll('[data-tab]');
  function paintTabs() {
    for (var i = 0; i < tabBtns.length; i++) {
      var on = tabBtns[i].getAttribute('data-tab') === tab;
      tabBtns[i].setAttribute('aria-pressed', on ? 'true' : 'false');
      tabBtns[i].className = 'rounded-[6px] px-2 py-[3px] text-[13px] text-ink '
        + 'transition-[background-color,opacity] duration-100 '
        + (on ? 'bg-field' : 'opacity-50 hover:opacity-75');
    }
  }
  for (var t = 0; t < tabBtns.length; t++) {
    tabBtns[t].addEventListener('click', function () {
      tab = this.getAttribute('data-tab');
      paintTabs();
    });
  }

  /* ── 初始状态：上游 phase 初值就是 "done"（两段回复已可见）──── */
  paintSend();
  paintTabs();
  setPhase('done');
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>
