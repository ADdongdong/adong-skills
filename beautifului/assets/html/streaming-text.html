/* ── minimal reset（替代 @import "tailwindcss"）─────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
  border: 0 solid;
}
html {
  -webkit-text-size-adjust: 100%;
  tab-size: 4;
}
body {
  margin: 0;
}

  margin: 0;
}
ol, ul, menu {
  margin: 0;
  padding: 0;
  list-style: none;
}
button, input, optgroup, select, textarea {
  margin: 0;
  padding: 0;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  background: transparent;
  border-radius: 0;
}
button, [type="button"], [type="reset"], [type="submit"] {
  appearance: button;
}
textarea {
  resize: vertical;
}
img, svg, video, canvas, audio, iframe, embed, object {
  display: block;
  vertical-align: middle;
}

  max-width: 100%;
  height: auto;
}
table {
  border-collapse: collapse;
  border-color: inherit;
  text-indent: 0;
}
a {
  color: inherit;
  text-decoration: inherit;
}
:disabled {

}

/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

  }

  }
}

@keyframes fade-up {

  }

  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

<body>
<div class="port-stage">
<!-- title: Streaming Text -->
<!--@classes: inline-->
<!-- 来源：components/primitives/StreamingText.tsx（上游 MIT）
     保真：WORD_MS = 55 / HOLD_MS = 3400 逐字照搬；逐词揭示（不是逐字），
           cite token → 内联来源 chip（pop-in 250ms）；尾部 2px 光标在自己 settle 后由
           fade-in 150ms 出现；来源头像堆叠用 .source-avatar（上游自定义类）；
           来源清单展开/收起走 grid-template-rows 1fr/0fr + opacity（cubic-bezier(0.23,1,0.32,1)）；
           追问按钮在 done 后按 i*90ms 逐条 fade-up；三个来源图标是上游内联的 data-URI SVG，原样保留。
     降级：无。
     说明：上游 StreamingText 用的是「逐词揭示」，并没有引用 atoms/StreamText.tsx 或
           atoms/Shimmer.tsx（那两个原子只被 SelectionActions.tsx 使用），所以这里没有内联它们。
     markup 与上游逐类对齐（transition-opacity/… 与 duration-* 都用上游原类名；
           twsubset 现已把 transition-* 排在 duration-* 之前输出，不需要内联兜底）。
     节点策略：token（含 chip）与光标按「只追加」维护，避免每 55ms 重建导致
           chip 的 pop-in 与光标的 fade-in 反复重播（React 里 by-key 复用节点，不会重播）。-->

<div class="port-frame">
  <p class="port-note">
    <strong>流式回答</strong> — 逐词流出的答案：文字流完前光标常亮，
    引用处内联一枚来源 chip（favicon + 域名），流完后依次出现复制 / 重试 / 点赞 / 点踩操作行、
    可展开的来源清单与两条「追问」建议。适用于聊天或 Agent 回复的流式渲染。
  </p>

  <div id="stream-host" class="w-[380px] max-w-full"></div>
</div>

<script>
(function () {
  /* ── 时序常量：逐字照搬上游 ──────────────────────────────────── */
  var WORD_MS = 55;    // const WORD_MS = 55;
  var HOLD_MS = 3400;  // const HOLD_MS = 3400;

  /* 逐词切分，中间插一个 cite 占位 token（上游 TOKENS 构造方式一致） */
  var TOKENS = [];
  'Pistachio is your fastest-growing flavor — sales are up 23% this month and margins beat vanilla by 8 points.'
    .split(' ').forEach(function (t) { TOKENS.push({ text: t }); });
  TOKENS.push({ text: '', cite: true });
  'Stone-fruit flavors are trending in the same range.'
    .split(' ').forEach(function (t) { TOKENS.push({ text: t }); });

  var FOLLOW_UPS = [
    'Which flavors sell best in winter',
    'Compare gelato and soft serve margins'
  ];

  /* 上游内联的 data-URI 图标（含单引号，故用双引号 JS 字符串承载） */
  var SOURCE_IMAGES = {
    scoop: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f7a5f'/%3E%3Cpath d='M20 36c0 7 5.4 12 12 12s12-5 12-12H20Z' fill='%23fff'/%3E%3Ccircle cx='32' cy='25' r='11' fill='%23bff3dd'/%3E%3Cpath d='M24 24c4-7 13-7 17 0' fill='none' stroke='%231f7a5f' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E",
    trends: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232f6fec'/%3E%3Cpath d='M15 43 27 31l8 7 14-18' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='49' cy='20' r='5' fill='%23bfe0ff'/%3E%3C/svg%3E",
    market: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23e56d24'/%3E%3Cpath d='M17 45V25h8v20h-8Zm11 0V16h8v29h-8Zm11 0V30h8v15h-8Z' fill='%23fff'/%3E%3Cpath d='M16 49h32' stroke='%23ffd6b8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
  };

  var SOURCES = [
    { name: 'Scoop Data', domain: 'scoopdata.io', href: 'https://scoopdata.io/', image: SOURCE_IMAGES.scoop },
    { name: 'Trends Index', domain: 'trends.google.com', href: 'https://trends.google.com/trends/', image: SOURCE_IMAGES.trends },
    { name: 'Market Basket', domain: 'marketbasket.io', href: 'https://marketbasket.io/', image: SOURCE_IMAGES.market }
  ];

  /* ACTION_ICONS：复制 / 重试 / 点赞 / 点踩（上游四段内联 SVG 子元素） */
  var ACTION_ICONS = [
    '<g><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></g>',
    '<path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/>',
    '<path d="M7 10v12M15 5.88L14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88z"/>',
    '<path d="M17 14V2M9 18.12L10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88z"/>'
  ];

  var FOLLOW_ICON = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M9 10l-5 5 5 5"/><path d="M20 4v7a4 4 0 0 1-4 4H4"/></svg>';

  var host = document.getElementById('stream-host');
  var els = null;
  var state = { count: 0, sourcesOpen: false, tokenNodes: 0, followUpAnimated: false };
  var timer = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* 内联来源 chip（SourceChip：favicon 3px 圆角 + 域名，pop-in 250ms）
   * 用 innerHTML 模板构造：组装脚本只从 `class="..."` 字面量收集类名，
   * 若改用 el.className='...'，这些类不会进 CSS，chip 会退化成行内文本。 */
  var CHIP_TEMPLATE =
    '<a target="_blank" rel="noreferrer" data-tok class="ml-0 mr-1 inline-flex h-4.5 translate-y-[-1px] items-center gap-1 rounded-[5px] bg-inset pr-[3px] pl-[3px] align-middle font-mono text-[10.5px] text-ink-2 shadow-hairline transition-colors duration-150 hover:bg-hover hover:text-ink" style="animation:pop-in 250ms cubic-bezier(0.23,1,0.32,1) both">'
    + '<img alt="" class="source-avatar size-3 rounded-[3px]"><span></span></a>';

  /* 光标：上游自己的小方块 + fade-in（不是 StreamText 原子的 .stream-caret） */
  var CARET_TEMPLATE =
    '<span class="ml-0.5 inline-block h-3 w-0.5 translate-y-0.5 rounded-full bg-ink" style="animation:fade-in 150ms ease-out both"></span>';

  function fromTemplate(html) {
    var wrap = document.createElement('div');
    wrap.innerHTML = html;
    return wrap.firstChild;
  }

  function chipEl(src) {
    var a = fromTemplate(CHIP_TEMPLATE);
    a.href = src.href;
    a.querySelector('img').src = src.image;
    a.querySelector('span').textContent = src.domain;
    return a;
  }

  function buildShell() {
    var actionButtons = '';
    for (var i = 0; i < ACTION_ICONS.length; i++) {
      actionButtons +=
        '<button type="button" aria-label="Action" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-colors duration-100 hover:bg-hover-2 hover:text-ink-2">'
        + '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + ACTION_ICONS[i] + '</svg>'
        + '</button>';
    }

    var avatars = '';
    for (var j = 0; j < SOURCES.length; j++) {
      avatars += '<img src="' + SOURCES[j].image + '" alt="" class="source-avatar size-3.5 rounded-full bg-surface shadow-[0_0_0_1.5px_var(--canvas)]">';
    }

    var sourceList = '';
    for (var k = 0; k < SOURCES.length; k++) {
      var s = SOURCES[k];
      sourceList +=
        '<a href="' + s.href + '" target="_blank" rel="noreferrer" class="flex items-center gap-2 rounded-[6px] px-1.5 py-1 text-[12px] text-ink-2 transition-colors duration-150 hover:bg-hover hover:text-ink">'
        + '<img src="' + s.image + '" alt="" class="source-avatar size-4 rounded-[4px]">'
        + '<span class="animated-underline">' + esc(s.name) + '</span>'
        + '<span class="ml-auto font-mono text-[10.5px] text-ink-3">' + esc(s.domain) + '</span>'
        + '</a>';
    }

    var followButtons = '';
    for (var f = 0; f < FOLLOW_UPS.length; f++) {
      followButtons +=
        '<button type="button" data-follow class="-mx-1.5 flex items-center gap-2 rounded-[7px] border-b border-line px-1.5 py-1.5 text-left text-[12.5px] text-ink transition-colors duration-100 hover:bg-hover-2" style="opacity:0">'
        + FOLLOW_ICON + esc(FOLLOW_UPS[f])
        + '</button>';
    }

    host.innerHTML =
      '<div class="min-h-[15.5rem] w-full max-w-95">'
      +   '<p class="text-[13px] leading-relaxed text-ink" data-p></p>'
      +   '<div class="mt-2 flex items-center gap-0.5 transition-opacity duration-400" data-actions style="opacity:0;pointer-events:none">'
      +     actionButtons
      +     '<button type="button" data-sources-toggle aria-expanded="false" class="ml-1.5 flex items-center gap-1.5 rounded-[6px] px-1 py-0.5 text-left transition-colors duration-150 hover:bg-hover">'
      +       '<span class="flex -space-x-1">' + avatars + '</span>'
      +       '<span class="text-[12px] text-ink-2">10 sources</span>'
      +     '</button>'
      +   '</div>'
      +   '<div class="grid transition-[grid-template-rows,opacity] duration-300" data-sources-panel style="grid-template-rows:0fr;opacity:0;transition-timing-function:cubic-bezier(0.23,1,0.32,1)">'
      +     '<div class="overflow-hidden">'
      +       '<div class="mt-1.5 flex flex-col rounded-[10px] bg-inset p-1 shadow-hairline">' + sourceList + '</div>'
      +     '</div>'
      +   '</div>'
      +   '<div class="mt-2.5 transition-opacity duration-400" data-followups style="opacity:0;pointer-events:none">'
      +     '<p class="text-[12px] font-medium text-ink-2">Follow-ups</p>'
      +     '<div class="mt-0.5 flex flex-col">' + followButtons + '</div>'
      +   '</div>'
      + '</div>';

    els = {
      p: host.querySelector('[data-p]'),
      actions: host.querySelector('[data-actions]'),
      toggle: host.querySelector('[data-sources-toggle]'),
      panel: host.querySelector('[data-sources-panel]'),
      followUps: host.querySelector('[data-followups]'),
      caret: null
    };
    els.toggle.addEventListener('click', function () {
      state.sourcesOpen = !state.sourcesOpen;
      sync();
    });
    var fbs = host.querySelectorAll('[data-follow]');
    for (var b = 0; b < fbs.length; b++) {
      fbs[b].addEventListener('click', function () {
        this.setAttribute('data-picked', 'true');
      });
    }
  }

  /* 逐词揭示：上游是「只增不减」的 count，这里同样只追加节点，避免动画重播 */
  function syncTokens(count) {
    if (count < state.tokenNodes) {
      var kids = els.p.children;
      for (var i = kids.length - 1; i >= 0; i--) {
        if (kids[i] !== els.caret) els.p.removeChild(kids[i]);
      }
      state.tokenNodes = 0;
    }
    while (state.tokenNodes < count) {
      var t = TOKENS[state.tokenNodes];
      var node;
      if (t.cite) {
        node = chipEl(SOURCES[0]);
      } else {
        node = document.createElement('span');
        node.className = 'inline';
        node.setAttribute('data-tok', '');
        node.textContent = t.text + ' ';
      }
      if (els.caret && els.caret.parentNode === els.p) els.p.insertBefore(node, els.caret);
      else els.p.appendChild(node);
      state.tokenNodes++;
    }
  }

  function sync() {
    var done = state.count >= TOKENS.length;

    /* 光标：流完前显示（fade-in 150ms 淡入），settle 后移除。
     * 注意上游这里用的是自己的小方块 + fade-in，而不是 StreamText 原子的 .stream-caret。 */
    if (!done && !els.caret) {
      els.caret = fromTemplate(CARET_TEMPLATE);
      els.p.appendChild(els.caret);
    } else if (done && els.caret) {
      els.caret.remove();
      els.caret = null;
    }

    syncTokens(state.count);

    /* 操作行 + 来源面板 + 追问：整体按 done 切换透明度与可点性 */
    els.actions.style.opacity = done ? '1' : '0';
    els.actions.style.pointerEvents = done ? 'auto' : 'none';
    els.followUps.style.opacity = done ? '1' : '0';
    els.followUps.style.pointerEvents = done ? 'auto' : 'none';

    var open = done && state.sourcesOpen;
    els.panel.style.gridTemplateRows = open ? '1fr' : '0fr';
    els.panel.style.opacity = open ? '1' : '0';
    els.toggle.setAttribute('aria-expanded', state.sourcesOpen ? 'true' : 'false');

    /* 追问在 done 的上升沿按 i*90ms 逐条入场（只播一次，不随其它状态变更重播） */
    if (done && !state.followUpAnimated) {
      state.followUpAnimated = true;
      var fbs = host.querySelectorAll('[data-follow]');
      for (var i = 0; i < fbs.length; i++) {
        fbs[i].setAttribute('style', 'animation:fade-up 350ms cubic-bezier(0.23,1,0.32,1) ' + (i * 90) + 'ms both');
      }
    } else if (!done && state.followUpAnimated) {
      state.followUpAnimated = false;
      var reset = host.querySelectorAll('[data-follow]');
      for (var j = 0; j < reset.length; j++) reset[j].setAttribute('style', 'opacity:0');
    }
  }

  /* count 每 tick +1；到末尾后停 HOLD_MS 再回到 0 循环（上游 loop=true 的默认行为） */
  function tick() {
    var done = state.count >= TOKENS.length;
    timer = setTimeout(function () {
      state.count = state.count >= TOKENS.length ? 0 : state.count + 1;
      sync();
      tick();
    }, done ? HOLD_MS : WORD_MS);
  }

  buildShell();
  sync();
  tick();
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
