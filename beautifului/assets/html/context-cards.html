/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

/* ── primitive spacing system ─────────────────────────────

}

.primitive-card-bar {

}

}

.primitive-table-cell {

}

  align-items: center;

}

/* ── shared keyframes ─────────────────────────────────── */

@keyframes shimmer-text {
  from {
    background-position: 150% center;
  }
  to {
    background-position: -50% center;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── 工具类（Tailwind 子集，由 twsubset.py 编译）───────────────
 * 颜色/圆角/阴影/缓动全部引用同名 var(--token)，
 * 因此配色与动效曲线与官网一致。
 * 选择器一律写成 [class~=] 属性形式而非转义类名：
 * 工具类含斜杠、冒号、方括号、百分号，转义极易出错。
 */

[class~="transition-[opacity,transform,background-color]"] {
  transition-property: opacity,transform,background-color;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="duration-300"] {
  transition-duration: 300ms;
}

[class~="bg-green"] {
  background-color: var(--green);
}

[class~="bg-inset"] {
  background-color: var(--inset);
}

[class~="bg-red"] {
  background-color: var(--red);
}

[class~="bg-surface"] {
  background-color: var(--surface);
}

[class~="border-b"] {
  border-bottom-width: 1px;
  border-style: solid;
}

[class~="border-line"] {
  border-color: var(--line);
  border-style: solid;
}

[class~="flex"] {
  display: flex;
}

[class~="flex-col"] {
  flex-direction: column;
}

[class~="font-bold"] {
  font-weight: 700;
}

[class~="font-medium"] {
  font-weight: 500;
}

[class~="font-semibold"] {
  font-weight: 600;
}

[class~="gap-1.5"] {
  gap: 0.375rem;
}

[class~="gap-2"] {
  gap: 0.5rem;
}

[class~="gap-2.5"] {
  gap: 0.625rem;
}

[class~="h-5"] {
  height: 1.25rem;
}

[class~="h-6"] {
  height: 1.5rem;
}

[class~="hover:bg-hover"]:hover {
  background-color: var(--hover);
}

[class~="inline-flex"] {
  display: inline-flex;
}

[class~="items-center"] {
  align-items: center;
}

[class~="justify-center"] {
  justify-content: center;
}

[class~="leading-relaxed"] {
  line-height: 1.625;
}

[class~="max-w-95"] {
  max-width: 23.75rem;
}

[class~="min-w-0"] {
  min-width: 0rem;
}

[class~="ml-auto"] {
  margin-left: auto;
}

[class~="overflow-hidden"] {
  overflow: hidden;
}

[class~="pb-1"] {
  padding-bottom: 0.25rem;
}

[class~="pb-3"] {
  padding-bottom: 0.75rem;
}

[class~="pt-2"] {
  padding-top: 0.5rem;
}

[class~="px-0.5"] {
  padding-left: 0.125rem;
  padding-right: 0.125rem;
}

[class~="px-1.5"] {
  padding-left: 0.375rem;
  padding-right: 0.375rem;
}

[class~="px-2"] {
  padding-left: 0.5rem;
  padding-right: 0.5rem;
}

[class~="px-3"] {
  padding-left: 0.75rem;
  padding-right: 0.75rem;
}

[class~="rounded-[4px]"] {
  border-radius: 4px;
}

[class~="rounded-card"] {
  border-radius: var(--radius-card);
}

[class~="rounded-full"] {
  border-radius: 9999px;
}

[class~="rounded-md"] {
  border-radius: 0.375rem;
}

[class~="shadow-btn"] {
  box-shadow: var(--shadow-btn);
}

[class~="shadow-card"] {
  box-shadow: var(--shadow-card);
}

[class~="shadow-hairline"] {
  box-shadow: var(--shadow-hairline);
}

[class~="shrink-0"] {
  flex-shrink: 0;
}

[class~="size-3.5"] {
  width: 0.875rem;
  height: 0.875rem;
}

[class~="tabular-nums"] {
  font-variant-numeric: tabular-nums;
}

[class~="text-[11.5px]"] {
  font-size: 11.5px;
}

[class~="text-[12.5px]"] {
  font-size: 12.5px;
}

[class~="text-[12px]"] {
  font-size: 12px;
}

[class~="text-[13px]"] {
  font-size: 13px;
}

[class~="text-[7px]"] {
  font-size: 7px;
}

[class~="text-ink"] {
  color: var(--ink);
}

[class~="text-ink-2"] {
  color: var(--ink-2);
}

[class~="text-ink-3"] {
  color: var(--ink-3);
}

[class~="text-white"] {
  color: white;
}

[class~="truncate"] {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

[class~="w-full"] {
  width: 100%;
}

</style>
</head>
<body>
<div class="port-stage">
<!-- title: Context Cards -->
<!--@classes: bg-red bg-green-->
<!-- 来源：components/primitives/ContextCards.tsx（上游 MIT）
     保真：检索到的 chunk 一次性入场后常驻。头部 fade-in 400ms ease-out；
           每张卡按索引错开 fade-up 400ms cubic-bezier(0.23,1,0.32,1)（i*100ms）；
           来源 chip 在 700ms 后整体揭示（opacity 0→1、scale 0.95→1，
           transition-[opacity,transform,background-color] 300ms cubic-bezier(0.23,1,0.32,1)，
           并各自延迟 i*80ms）—— 时序常量逐字照搬。
     DOM 层级与上游一致（卡片 / primitive-card-bar / 正文 / chip 行）。
     依赖降级：无（纯 HTML/CSS/JS）。badge 的 bg-red / bg-green 由数据生成，
     故在 @classes 中声明。-->

<div class="port-frame">
  <p class="port-note">
    <strong>上下文卡</strong> — Agent 检索到的资料块（chunk）：进入时整组错开 <code>fade-up</code> 上浮，
    顶部一行是标题 + 字符数，正文是片段内容，底部是来源 chip（在 700ms 后按 80ms 逐一
    缩放淡入）。用于回答前先把「我参考了哪些资料」摆给用户看。
  </p>

  <div id="cc-host" style="width:380px;max-width:100%"></div>
</div>

<script>
(function () {
  /* 逐字照搬上游常量（ContextCards.tsx） */
  var LABELS = { header: 'All chunks', count: '32' };
  var CHUNKS = [
    {
      title: 'Vendor onboarding rule',
      chars: '290 characters',
      body: 'Cold-chain certification must be verified before a new dairy can be added to the reorder workflow.',
      source: 'Dairy Onboarding SOP.pdf',
      badge: 'PDF',
      tone: 'bg-red'
    },
    {
      title: 'Seasonal demand row',
      chars: '1,250 characters',
      body: 'Q4 velocity table: pistachio +18%, vanilla +6%, rocky road -11%; retire flavors below 40 scoops weekly.',
      source: 'Sales Velocity Export.csv',
      badge: 'CSV',
      tone: 'bg-green'
    }
  ];

  var rows = '';
  for (var i = 0; i < CHUNKS.length; i++) {
    var c = CHUNKS[i];
    rows += '<div class="overflow-hidden rounded-card bg-surface shadow-card" style="animation:fade-up 400ms cubic-bezier(0.23,1,0.32,1) ' + (i * 100) + 'ms both">'
      + '<div class="primitive-card-bar flex items-center gap-2.5 border-b border-line">'
      +   '<span class="flex min-w-0 items-center gap-1.5 text-[13px] font-medium text-ink">'
      +     '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"></path></svg>'
      +     '<span class="truncate">' + c.title + '</span>'
      +   '</span>'
      +   '<span class="ml-auto shrink-0 text-[12px] text-ink-3 tabular-nums">' + c.chars + '</span>'
      + '</div>'
      + '<p class="px-3 pt-2 pb-1 text-[12.5px] leading-relaxed text-ink-2">' + c.body + '</p>'
      + '<div class="px-3 pb-3">'
      +   '<span data-chip class="inline-flex h-6 items-center gap-1.5 rounded-full bg-inset px-2 text-[12px] font-medium text-ink-2 shadow-btn transition-[opacity,transform,background-color] duration-300 hover:bg-hover" '
      +     'style="opacity:0;transform:scale(0.95);transition-timing-function:cubic-bezier(0.23, 1, 0.32, 1);transition-delay:' + (i * 80) + 'ms">'
      +     '<span class="flex size-3.5 items-center justify-center rounded-[4px] text-[7px] font-bold text-white ' + c.tone + '">' + c.badge + '</span>'
      +     c.source
      +     '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M7 7h10v10"></path></svg>'
      +   '</span>'
      + '</div>'
      + '</div>';
  }

  var host = document.getElementById('cc-host');
  host.innerHTML =
    '<div class="flex w-full max-w-95 flex-col gap-2">'
    + '<div class="flex items-center gap-2 px-0.5" style="animation:fade-in 400ms ease-out both">'
    +   '<span class="text-[13px] font-semibold text-ink">' + LABELS.header + '</span>'
    +   '<span class="inline-flex h-5 items-center rounded-md bg-inset px-1.5 text-[11.5px] font-medium text-ink-2 shadow-hairline tabular-nums">' + LABELS.count + '</span>'
    + '</div>'
    + rows
    + '</div>';

  /* 700ms 后来源 chip 揭示（对应上游 chipsShown 状态） */
  setTimeout(function () {
    var chips = host.querySelectorAll('[data-chip]');
    for (var i = 0; i < chips.length; i++) {
      chips[i].style.opacity = '1';
      chips[i].style.transform = 'scale(1)';
    }
  }, 700);
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
