/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

  }

  }
}

@keyframes fade-up {
  from {

  }

    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── 工具类（Tailwind 子集，由 twsubset.py 编译）───────────────
 * 颜色/圆角/阴影/缓动全部引用同名 var(--token)，
 * 因此配色与动效曲线与官网一致。
 * 选择器一律写成 [class~=] 属性形式而非转义类名：
 * 工具类含斜杠、冒号、方括号、百分号，转义极易出错。
 */

[class~="transition-[grid-template-rows,opacity]"] {
  transition-property: grid-template-rows,opacity;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-[transform,background-color,opacity]"] {
  transition-property: transform,background-color,opacity;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-colors"] {
  transition-property: color, background-color, border-color, text-decoration-color, fill, stroke;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="duration-150"] {

}

}

}

<body>
<div class="port-stage">
<!-- title: Recommendation Card -->
<!--@classes:
  inline-flex items-center justify-center font-medium select-none transition-[transform,background-color,opacity] duration-150 ease-out active:scale-[0.96] disabled:opacity-50 disabled:pointer-events-none
  h-[27px] leading-none rounded-full gap-1.5
  bg-surface text-ink shadow-btn hover:bg-inset aria-expanded:bg-hover px-2.5 text-[12.5px]
  bg-accent text-white hover:bg-accent-ink shadow-[inset_0_1px_0_rgba(255,255,255,0.14)] px-3
  bg-ink text-canvas hover:opacity-90 dark:bg-ink dark:text-canvas shadow-[inset_0_1px_0_rgba(255,255,255,0.14)] px-3
  bg-green text-white hover:brightness-95 shadow-[inset_0_1px_0_rgba(255,255,255,0.14)] px-3
  mx-0.5 inline-flex items-center gap-1 rounded-full bg-field py-px pl-[3px] pr-1.5 align-middle shadow-hairline
  flex size-4 shrink-0 items-center justify-center rounded-full text-[9px] font-semibold leading-none text-white
  text-[12px] font-medium text-ink
  mx-0.5 inline-flex items-center rounded-full px-1.5 py-0 align-middle text-[12px] font-medium bg-field text-ink-2
  bg-green-tint text-green
  mx-0.5 inline-flex items-center rounded-full px-1.5 py-0 align-middle text-[12px] font-medium
-->
<!-- 来源：components/primitives/RecommendationCard.tsx（上游 MIT）
     内联了 3 个原子：atoms/Button.tsx（cva 变体手写为 class 分支，含 tailwind-merge 的去重结果：
     Alternatives 调用方传 px-2.5 / text-[12.5px]，覆盖 size sm 的 px-3 / text-[13px]；
     主按钮调用方只传 text-[12.5px]，所以仍保留 size sm 的 px-3。两处都按合并后的最终类写死）、
     atoms/EntityChip.tsx（含 Monogram，默认色 #e08a3c 为上游默认值）、atoms/ValuePill.tsx（5 种 tone 的 tint + ring）。
     保真：备选抽屉用 grid-template-rows 0fr→1fr + opacity，300ms + cubic-bezier(0.16,1,0.3,1)；
           正文切换重放 fade-in 180ms ease-out；置信度仪表 3 格、transition-colors duration-300；
           抽屉行 hover:bg-hover、transition-colors duration-100 全部照搬。
     降级：无 npm 依赖。cn/tailwind-merge 的类合并提前算好写死。-->

<div class="port-frame">
  <p class="port-note">
    <strong>建议卡片</strong> — Agent 给出一个行动建议 + 置信度仪表（3 格信号条），
    点 <code>Alternatives</code> 从底部展开抽屉列出其它备选；选一条会把它提升为主建议并重放淡入，
    主按钮随之换文案与配色（accent / primary）。点 <code>Accept</code> 后按钮转为绿色 success 态。
    适合「Agent 建议 + 人来拍板」的场景。
  </p>

  <div class="w-full max-w-95 overflow-hidden rounded-card bg-surface shadow-card">
    <div class="primitive-card-pad">
      <span class="text-[14px] font-medium text-ink">Want me to place this restock order?</span>
      <p id="rc-body" class="mt-1.5 min-h-12 text-[13px] leading-relaxed text-ink-2"></p>
    </div>

    <!-- alternatives drawer — 卡片内一个明确的新区段 -->
    <div id="rc-drawer" class="grid transition-[grid-template-rows,opacity] duration-300"
      style="grid-template-rows:0fr;opacity:0;transition-timing-function:cubic-bezier(0.16, 1, 0.3, 1)">
      <div class="overflow-hidden">
        <div class="border-t border-line bg-surface px-2 py-2">
          <p class="px-1.5 pb-1 text-[11px] font-medium text-ink-3">Other options</p>
          <div id="rc-rows"></div>
        </div>
      </div>
    </div>

    <div class="primitive-card-footer flex items-center justify-between gap-3 bg-surface">
      <span class="flex items-center gap-2">
        <span id="rc-meter" class="flex items-end gap-0.5"></span>
        <span id="rc-label" class="text-[12.5px] font-medium text-ink-2"></span>
      </span>
      <span class="-mr-0.5 flex items-center gap-2">
        <button id="rc-alt" type="button" aria-expanded="false"></button>
        <button id="rc-cta" type="button"></button>
      </span>
    </div>
  </div>
</div>

<script>
(function () {
  /* ── 内联 atoms/Button.tsx：cva 变体手写为 class 分支 ───────────
   * base + size sm 为公共部分；调用方 className（px-2.5 / text-[12.5px]）
   * 经 tailwind-merge 覆盖 size 的 px-3 / text-[13px]，这里直接写最终值。 */
  var BTN_BASE = 'inline-flex items-center justify-center font-medium select-none '
    + 'transition-[transform,background-color,opacity] duration-150 ease-out '
    + 'active:scale-[0.96] disabled:opacity-50 disabled:pointer-events-none '
    + 'h-[27px] leading-none rounded-full gap-1.5';
  var BTN = {
    secondary: BTN_BASE + ' bg-surface text-ink shadow-btn hover:bg-inset aria-expanded:bg-hover px-2.5 text-[12.5px]',
    accent:    BTN_BASE + ' bg-accent text-white hover:bg-accent-ink shadow-[inset_0_1px_0_rgba(255,255,255,0.14)] px-3 text-[12.5px]',
    primary:   BTN_BASE + ' bg-ink text-canvas hover:opacity-90 dark:bg-ink dark:text-canvas shadow-[inset_0_1px_0_rgba(255,255,255,0.14)] px-3 text-[12.5px]',
    success:   BTN_BASE + ' bg-green text-white hover:brightness-95 shadow-[inset_0_1px_0_rgba(255,255,255,0.14)] px-3 text-[12.5px]'
  };

  /* ── 内联 atoms/EntityChip.tsx（含 Monogram，默认色沿用上游 #e08a3c）*/
  function monogram(text, color) {
    return '<span class="flex size-4 shrink-0 items-center justify-center rounded-full '
         + 'text-[9px] font-semibold leading-none text-white" style="background:' + (color || '#e08a3c') + '">'
         + text + '</span>';
  }
  function entityChip(name, color) {
    return '<span class="mx-0.5 inline-flex items-center gap-1 rounded-full bg-field '
         + 'py-px pl-[3px] pr-1.5 align-middle shadow-hairline">'
         + monogram(name.charAt(0), color)
         + '<span class="text-[12px] font-medium text-ink">' + name + '</span>'
         + '</span>';
  }

  /* ── 内联 atoms/ValuePill.tsx：5 种 tone 的 class + 描边 ring ─── */
  var PILL_TONES = {
    neutral: { cls: 'bg-field text-ink-2', ring: 'var(--shadow-hairline)' },
    green:   { cls: 'bg-green-tint text-green', ring: '0 0 0 1px color-mix(in oklch, var(--green) 28%, transparent)' },
    orange:  { cls: 'bg-orange-tint text-orange', ring: '0 0 0 1px color-mix(in oklch, var(--orange) 28%, transparent)' },
    red:     { cls: 'bg-red-tint text-red', ring: '0 0 0 1px color-mix(in oklch, var(--red) 28%, transparent)' },
    accent:  { cls: 'bg-accent-tint text-accent-ink', ring: '0 0 0 1px color-mix(in oklch, var(--accent) 28%, transparent)' }
  };
  function valuePill(text, tone) {
    var t = PILL_TONES[tone || 'neutral'];
    return '<span class="mx-0.5 inline-flex items-center rounded-full px-1.5 py-0 '
         + 'align-middle text-[12px] font-medium ' + t.cls + '" style="box-shadow:' + t.ring + '">'
         + text + '</span>';
  }

  /* ── 上游 OPTIONS 逐字照搬 ───────────────────────────────── */
  var OPTIONS = [
    {
      key: 'high',
      html: 'Reorder waffle cones from ' + entityChip('Cone King') + ' with lead time ' + valuePill('7 days', 'green'),
      short: 'Reorder from Cone King · 7-day lead',
      signal: 3, tone: 'var(--green)', label: 'High confidence',
      cta: 'Accept', ctaVariant: 'accent'
    },
    {
      key: 'review',
      html: 'Switch vanilla to ' + valuePill('Vanilla Madagascar', 'neutral') + ' for peak season.',
      short: 'Switch to Vanilla Madagascar',
      signal: 2, tone: 'var(--orange)', label: 'Needs review',
      cta: 'Configure', ctaVariant: 'primary'
    },
    {
      key: 'none',
      html: 'Fall back to a <span class="font-medium text-ink">full restock</span> across every SKU.',
      short: 'Full restock across every SKU',
      signal: 0, tone: 'var(--ink-3)', label: 'No signal',
      cta: 'Accept full restock', ctaVariant: 'primary'
    }
  ];

  /* 置信度仪表：3 格信号条，bar < signal 上色，否则用 --line-strong */
  function meterHTML(signal, tone) {
    var bars = '';
    for (var bar = 0; bar < 3; bar++) {
      bars += '<span class="w-1 rounded-full transition-colors duration-300" style="height:10px;background:'
            + (bar < signal ? tone : 'var(--line-strong)') + '"></span>';
    }
    return bars;
  }

  var body = document.getElementById('rc-body');
  var rowsEl = document.getElementById('rc-rows');
  var meter = document.getElementById('rc-meter');
  var label = document.getElementById('rc-label');
  var altBtn = document.getElementById('rc-alt');
  var ctaBtn = document.getElementById('rc-cta');
  var drawer = document.getElementById('rc-drawer');

  var selected = 0;
  var open = false;
  var accepted = false;

  function renderBody() {
    var o = OPTIONS[selected];
    body.innerHTML = o.html;
    /* React 的 key={active.key} → 换选项时重放 fade-in */
    body.style.animation = 'none';
    void body.offsetWidth;
    body.style.animation = 'fade-in 180ms ease-out both';
  }

  function renderRows() {
    var html = '';
    for (var i = 0; i < OPTIONS.length; i++) {
      if (i === selected) continue;
      var o = OPTIONS[i];
      html += '<button type="button" data-pick="' + i + '" '
           +  'class="flex w-full items-center gap-2.5 rounded-control px-1.5 py-1.5 '
           +  'text-left transition-colors duration-100 hover:bg-hover">'
           +    '<span class="flex items-end gap-0.5">' + meterHTML(o.signal, o.tone) + '</span>'
           +    '<span class="min-w-0 flex-1 truncate text-[12.5px] text-ink">' + o.short + '</span>'
           +    '<span class="shrink-0 text-[11px] text-ink-3">' + o.label + '</span>'
           +  '</button>';
    }
    rowsEl.innerHTML = html;
    var picks = rowsEl.querySelectorAll('[data-pick]');
    for (var p = 0; p < picks.length; p++) {
      picks[p].addEventListener('click', function () {
        selected = Number(this.getAttribute('data-pick'));
        accepted = false;
        renderBody();
        renderRows();
        renderFooter();
      });
    }
  }

  function renderFooter() {
    var o = OPTIONS[selected];
    meter.innerHTML = meterHTML(o.signal, o.tone);
    label.textContent = o.label;
    if (accepted) {
      ctaBtn.className = BTN.success;
      ctaBtn.textContent = 'Accepted';
    } else {
      ctaBtn.className = BTN[o.ctaVariant];
      ctaBtn.textContent = o.cta;
    }
  }

  altBtn.className = BTN.secondary;
  altBtn.textContent = 'Alternatives';
  altBtn.addEventListener('click', function () {
    open = !open;
    altBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    drawer.style.gridTemplateRows = open ? '1fr' : '0fr';
    drawer.style.opacity = open ? '1' : '0';
  });
  ctaBtn.addEventListener('click', function () {
    accepted = true;
    renderFooter();
  });

  renderBody();
  renderRows();
  renderFooter();
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>
