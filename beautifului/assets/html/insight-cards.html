/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

  }

  }
}

@keyframes fade-up {

  }

  }
}

.home-reveal {

}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);

/* ── port-only chrome：变体切换条 ─────────────────────────────

 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。

<body>
<div class="port-stage">
<!-- title: Insight Cards -->
<!--@classes: bg-orange bg-accent bg-line-strong bg-line text-orange text-ink-2 text-ink-3 text-red text-green hover:text-ink-2 hover:text-ink bg-field text-ink-->
<!-- 来源：components/primitives/InsightCards.tsx（上游 MIT）
     降级：npm 包 liveline 全部替换为自绘 SVG 折线/面积图（无依赖）。曲线用上游同款
           Catmull-Rom 重采样（smooth：3 点以上，每段 9 采样，末点原样）保证与官网同样平滑；
           图表窗口/内边距/线宽照搬 props（CompareCard padding {40,0,22,0}、lineWidth 2.25；
           AnomalyCard padding {34,0,22,0}、grid）；hover 游标与 tooltip 复用上游自定义类
           .insight-chart-stage / -cursor / -tooltip-anchor / -tooltip / -tooltip-item / -tooltip-dot
           与 --tooltip-* 令牌、--shadow-overlay，未新增任何图表样式。
     保真：分页 carousel（‹ › + 页码）、blur crossfade（transition-[opacity,filter] duration-250）、
           文字 — 页码 — 卡片 — pill 的结构；CompareCard 双序列/大百分比/legend；
           AnomalyCard Spend/Usage 切换、阈值文案、底部金额；AllocationCard 分段条 + legend。
     verify workaround：已全部撤回，本文件回到上游 class（包括 text-white / bg-white/20 /
           inline-block 等），不再为规避审计引入 inline style。-->

<div class="port-frame">
  <p class="port-note">
    <strong>洞察卡</strong> — 分页的 Agent 洞察轮播：每一页是一段结论 + 一张小图表 + 一个追问 pill。
    图表由自绘 SVG 折线构成（替代 npm 的 <code>liveline</code>），鼠标在图上移动会有游标线与
    tooltip 跟随，并实时读出该点的数值。左边 <code>‹ ›</code> 翻页，翻页是模糊淡入淡出。
  </p>

  <div id="ic-host" style="width:344px;max-width:100%"></div>
</div>

<script>
(function () {
  /* 逐字照搬上游常量（InsightCards.tsx） */
  var EASE = 'cubic-bezier(0.16, 1, 0.3, 1)';
  function formatPercent(v) { return (v > 0 ? '+' : '') + v.toFixed(2) + '%'; }
  function formatMoney(v) { return '$' + Math.round(v).toLocaleString('en-US'); }

  /* Catmull-Rom 重采样（逐字照搬 smooth） */
  function smooth(values, perSegment) {
    perSegment = perSegment || 9;
    if (values.length < 3) return values.slice();
    var out = [], n = values.length;
    for (var i = 0; i < n - 1; i += 1) {
      var p0 = values[Math.max(0, i - 1)];
      var p1 = values[i];
      var p2 = values[i + 1];
      var p3 = values[Math.min(n - 1, i + 2)];
      for (var s = 0; s < perSegment; s += 1) {
        var t = s / perSegment, t2 = t * t, t3 = t2 * t;
        out.push(0.5 * (2 * p1 + (-p0 + p2) * t + (2 * p0 - 5 * p1 + 4 * p2 - p3) * t2 + (-p0 + 3 * p1 - 3 * p2 + p3) * t3));
      }
    }
    out.push(values[n - 1]);
    return out;
  }

  var COMPARE_SERIES = [
    { name: 'Mint Chip', values: [-2.9, -3.4, -3.05, -3.86, -3.52, -4.1, -3.82, -4.41], sub: '-$2,377.66', tone: 'red', dot: 'bg-orange', color: '#f68f3c', tooltipColor: 'var(--orange)' },
    { name: 'Pistachio', values: [0.22, 0.58, 0.42, 0.91, 0.76, 1.08, 0.96, 1.15], sub: '+$617.22', tone: 'green', dot: 'bg-accent', color: '#3d9aff', tooltipColor: 'var(--accent)' }
  ];
  var ANOMALY = { spend: [274, 289, 264, 307, 331, 1210, 1718, 2112], usage: [18, 19, 17, 21, 22, 58, 81, 96] };
  var ALLOC = [
    { name: 'VAN', label: 'Vanilla', pct: 72.5, amount: '$51,785', cls: 'bg-orange', tone: 'text-orange' },
    { name: 'CHOC', label: 'Chocolate', pct: 22.8, amount: '$16,278', cls: 'bg-line-strong', tone: 'text-ink-2' },
    { name: 'MINT', label: 'Mint', pct: 4.7, amount: '$3,357', cls: 'bg-line', tone: 'text-ink-3' }
  ];

  var state = { page: 0, metric: 'spend', alloc: 'VAN' };

  /* ── 小部件 ── */
  function entity(name, tone) {
    return '<span class="inline-flex items-center gap-1 align-baseline font-medium text-ink"><span class="inline-block size-2.5 rounded-full ' + tone + '"></span>@' + name + '</span>';
  }
  function mono(txt, tone) {
    return '<code class="font-mono text-[11.5px] ' + (tone === 'red' ? 'text-red' : 'text-green') + '">' + txt + '</code>';
  }
  function tooltipHtml(rows) {
    var s = '';
    for (var i = 0; i < rows.length; i++) {
      s += '<span class="insight-chart-tooltip-item"><span class="insight-chart-tooltip-dot" style="background:' + rows[i].color + '"></span>' + rows[i].value + '</span>';
    }
    return '<div class="insight-chart-tooltip">' + s + '</div>';
  }

  /* ── 自绘折线图（替代 liveline）── */
  function mountChart(stage, cfg) {
    function draw() {
      var holder = stage.querySelector('[data-chart]');
      var W = stage.clientWidth, H = stage.clientHeight;
      if (!W || !H) return;
      var pad = cfg.padding;
      var innerL = pad.left, innerR = W - pad.right, innerT = pad.top, innerB = H - pad.bottom;
      var all = [];
      cfg.series.forEach(function (s) { all = all.concat(s.values); });
      var mn = Math.min.apply(null, all), mx = Math.max.apply(null, all);
      if (mn === mx) { mn -= 1; mx += 1; }
      var rng = mx - mn; mn -= rng * 0.08; mx += rng * 0.08;
      function X(i, N) { return innerL + (N <= 1 ? 0 : (i / (N - 1)) * (innerR - innerL)); }
      function Y(v) { return innerB - ((v - mn) / (mx - mn)) * (innerB - innerT); }
      var svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="position:absolute;inset:0">';
      if (cfg.grid) {
        for (var g = 0; g <= 3; g++) {
          var gy = innerT + (g / 3) * (innerB - innerT);
          svg += '<line x1="' + innerL + '" y1="' + gy.toFixed(2) + '" x2="' + innerR + '" y2="' + gy.toFixed(2) + '" stroke="var(--grid-line)" stroke-width="1"></line>';
        }
      }
      cfg.series.forEach(function (s) {
        var vs = cfg.smooth ? smooth(s.values) : s.values.slice();
        var N = vs.length, d = '';
        for (var i = 0; i < N; i++) d += (i ? 'L' : 'M') + X(i, N).toFixed(2) + ' ' + Y(vs[i]).toFixed(2) + ' ';
        svg += '<path d="' + d + '" fill="none" stroke="' + s.color + '" stroke-width="' + cfg.lineWidth + '" stroke-linecap="round" stroke-linejoin="round"></path>';
      });
      svg += '</svg>';
      holder.innerHTML = svg;
    }
    draw();
    if (window.ResizeObserver) new ResizeObserver(draw).observe(stage);
  }

  function bindHover(stage, cfg) {
    var cursor = stage.querySelector('.insight-chart-cursor');
    var anchor = stage.querySelector('.insight-chart-tooltip-anchor');
    var N = cfg.pointCount;
    function fromEvent(e) {
      var r = stage.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
      return Math.round(p * (N - 1));
    }
    function set(i) {
      var pct = (i / (N - 1)) * 100;
      cursor.style.display = 'block';
      cursor.style.left = pct + '%';
      anchor.style.display = 'block';
      anchor.style.left = Math.min(Math.max(pct, 28), 72) + '%';
      anchor.innerHTML = cfg.tooltip(i);
      if (cfg.onHover) cfg.onHover(i);
    }
    function clear() {
      cursor.style.display = 'none';
      anchor.style.display = 'none';
      if (cfg.onHover) cfg.onHover(null);
    }
    stage.addEventListener('pointerdown', function (e) { set(fromEvent(e)); });
    stage.addEventListener('pointermove', function (e) { set(fromEvent(e)); });
    stage.addEventListener('pointerleave', clear);
    stage.addEventListener('pointercancel', clear);
    stage.addEventListener('pointerup', clear);
  }

  var stageShell = function (key) {
    return '<div class="insight-chart-stage relative h-[166px]" data-stage="' + key + '">'
      + '<div data-chart style="position:absolute;inset:0"></div>'
      + '<span class="insight-chart-cursor" style="left:0;display:none"></span>'
      + '<span class="insight-chart-tooltip-anchor" style="left:50%;display:none"></span>'
      + '</div>';
  };

  /* ── 1. CompareCard ── */
  function compareCardHtml() {
    var dens = COMPARE_SERIES.map(function (s) { return smooth(s.values); });
    var legend = COMPARE_SERIES.map(function (s, i) {
      var last = dens[i][dens[i].length - 1];
      return '<div class="flex-1">'
        + '<span class="flex items-center gap-1.5 text-[11.5px] text-ink-2"><span class="size-2 rounded-full ' + s.dot + '"></span>' + s.name + '</span>'
        + '<span class="block text-[17px] font-semibold tracking-[-0.01em] tabular-nums ' + (s.tone === 'red' ? 'text-red' : 'text-green') + '">' + formatPercent(last) + '</span>'
        + mono(s.sub, s.tone)
        + '</div>';
    }).join('');
    return '<div class="min-h-[278px] rounded-card bg-surface p-3 shadow-hairline">'
      + '<div class="flex items-center gap-4">' + legend + '</div>'
      + '<div class="mt-2 overflow-hidden rounded-control bg-inset shadow-hairline">'
      +   '<div class="flex items-center justify-between border-b border-line px-2.5 py-1.5">'
      +     '<span class="text-[11px] text-ink-3 tabular-nums">Trend snapshot</span>'
      +     '<span class="rounded-full bg-field px-2 py-0.5 text-[10.5px] font-medium text-ink-2">Snapshot</span>'
      +   '</div>'
      +   stageShell('compare')
      + '</div>'
      + '</div>';
  }
  function mountCompare() {
    var stage = document.querySelector('[data-stage="compare"]');
    var dens = COMPARE_SERIES.map(function (s) { return smooth(s.values); });
    mountChart(stage, {
      series: COMPARE_SERIES.map(function (s) { return { values: s.values, color: s.color }; }),
      padding: { top: 40, right: 0, bottom: 22, left: 0 },
      grid: false, lineWidth: 2.25, smooth: true
    });
    bindHover(stage, {
      pointCount: dens[0].length,
      tooltip: function (i) {
        return tooltipHtml(COMPARE_SERIES.map(function (s, k) {
          return { color: s.tooltipColor, value: formatPercent(dens[k][i]) };
        }));
      }
    });
  }

  /* ── 2. AnomalyCard ── */
  function anomalyCardHtml() {
    var metric = state.metric;
    var data = ANOMALY[metric];
    var value = data[data.length - 1];
    var threshold = metric === 'spend' ? '$2,112' : '82 kWh';
    var moneyLabel = formatMoney(ANOMALY.spend[ANOMALY.spend.length - 1]);
    function mbtn(key, label) {
      var on = metric === key;
      return '<button type="button" data-metric="' + key + '" aria-pressed="' + on + '" class="rounded-full px-2 py-0.5 text-[10.5px] font-medium transition-[background-color,color,box-shadow,transform] duration-150 active:scale-[0.96] ' + (on ? 'bg-surface text-ink shadow-btn' : 'text-ink-3 hover:text-ink-2') + '">' + label + '</button>';
    }
    return '<div class="min-h-[278px] rounded-card bg-surface p-3 shadow-hairline">'
      + '<div class="flex items-center justify-between">'
      +   '<span class="flex items-center gap-1.5 text-[12px] font-medium text-ink">'
      +     '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>'
      +     'High freezer spend</span>'
      +   '<span class="rounded-full bg-field px-2 py-0.5 text-[10.5px] font-medium text-ink-2">Snapshot</span>'
      + '</div>'
      + '<div class="mt-2 overflow-hidden rounded-control bg-inset shadow-hairline">'
      +   '<div class="flex items-center justify-between border-b border-line px-2.5 py-1.5">'
      +     '<span class="text-[11px] text-ink-3 tabular-nums" id="ic-anomaly-header">' + threshold + ' threshold</span>'
      +     '<span class="flex rounded-full bg-field p-0.5">' + mbtn('spend', 'Spend') + mbtn('usage', 'Usage') + '</span>'
      +   '</div>'
      +   stageShell('anomaly')
      + '</div>'
      + '<div class="mt-1.5 flex items-baseline gap-2">'
      +   '<span class="text-[17px] font-semibold tracking-[-0.01em] text-ink tabular-nums">' + moneyLabel + ' spent</span>'
      +   '<code class="font-mono text-[11.5px] text-red">+$1,834.66</code>'
      +   '<span class="text-[11px] text-ink-3">vs 3 months</span>'
      + '</div>'
      + '</div>';
  }
  function mountAnomaly() {
    var stage = document.querySelector('[data-stage="anomaly"]');
    var metric = state.metric;
    var data = ANOMALY[metric];
    var header = document.getElementById('ic-anomaly-header');
    var threshold = metric === 'spend' ? '$2,112' : '82 kWh';
    function fmt(v) { return metric === 'spend' ? formatMoney(v) : Math.round(v) + ' kWh'; }
    mountChart(stage, {
      series: [{ values: data, color: '#ee5c61' }],
      padding: { top: 34, right: 0, bottom: 22, left: 0 },
      grid: true, lineWidth: 2.25, smooth: true
    });
    bindHover(stage, {
      pointCount: data.length,
      onHover: function (i) { header.textContent = (i === null) ? (threshold + ' threshold') : fmt(data[i]); },
      tooltip: function (i) { return tooltipHtml([{ color: 'var(--red)', value: fmt(data[i]) }]); }
    });
  }

  /* ── 3. AllocationCard ── */
  function allocCardHtml() {
    var sel = state.alloc;
    var active = ALLOC.filter(function (s) { return s.name === sel; })[0] || ALLOC[0];
    var segs = ALLOC.map(function (s) {
      var on = s.name === sel;
      return '<button type="button" data-alloc="' + s.name + '" aria-pressed="' + on + '" aria-label="' + s.label + ': ' + s.pct + '%" '
        + 'class="relative h-full overflow-hidden rounded-full ' + s.cls + ' transition-[opacity,transform,box-shadow] duration-300 active:scale-[0.98]" '
        + 'style="width:' + s.pct + '%;opacity:' + (on ? 1 : 0.58) + ';' + (on ? 'box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22);' : '') + 'transition-timing-function:' + EASE + '">'
        + '<span class="absolute inset-y-1 left-1 rounded-full bg-white/20 transition-[width,opacity] duration-500" '
        +   'style="width:' + (on ? 'calc(100% - 8px)' : '0%') + ';opacity:' + (on ? 1 : 0) + ';transition-timing-function:' + EASE + '"></span>'
        + '</button>';
    }).join('');
    var legend = ALLOC.map(function (s) {
      var on = s.name === sel;
      return '<button type="button" data-alloc="' + s.name + '" aria-pressed="' + on + '" class="flex items-center gap-1 rounded-full px-1.5 py-0.5 text-[11px] transition-[background-color,color,transform] duration-150 active:scale-[0.96] ' + (on ? 'bg-field text-ink' : 'text-ink-2 hover:bg-hover hover:text-ink') + '">'
        + '<span class="size-1.5 rounded-full ' + s.cls + '"></span>' + s.name + ' <span class="tabular-nums">' + s.pct + '%</span>'
        + '</button>';
    }).join('');
    return '<div class="min-h-[278px] rounded-card bg-surface p-3 shadow-hairline">'
      + '<span class="flex items-center gap-1.5 text-[12px] font-medium text-ink">'
      +   '<span class="flex size-3.5 items-center justify-center rounded-full bg-orange text-[8px] font-bold text-white">V</span>'
      +   'Vanilla allocation</span>'
      + '<span class="mt-1 block text-[20px] font-semibold tracking-[-0.01em] text-ink tabular-nums">' + active.amount + '</span>'
      + '<div class="mt-3 flex h-9 gap-0.5 overflow-hidden rounded-full bg-field p-0.5" role="group" aria-label="Allocation segments">' + segs + '</div>'
      + '<div class="mt-2 flex items-center gap-1.5">' + legend + '</div>'
      + '<div class="mt-3 min-h-16 rounded-control bg-inset px-2.5 py-2 shadow-hairline">'
      +   '<span class="block text-[11.5px] font-medium ' + active.tone + '">' + active.label + '</span>'
      +   '<span class="mt-1 block text-[11px] leading-relaxed text-ink-3">Contribution snapshot across current inventory value. Segment selection changes the inspected group without moving the card.</span>'
      + '</div>'
      + '</div>';
  }
  function mountAlloc() {
    var btns = document.querySelectorAll('#ic-card [data-alloc]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        state.alloc = this.getAttribute('data-alloc');
        renderCard();
      });
    }
  }

  /* ── 页面定义 ── */
  var PAGES = [
    {
      key: 'compare',
      prose: 'The worst performer in your ' + entity('Creamery', 'bg-orange') + ' is Rocky Road — down ' + mono('-6%', 'red') + ' or ' + mono('-$2,453.44', 'red') + '.',
      card: compareCardHtml, mount: function () { mountCompare(); }, pill: 'Should I rebalance flavors?'
    },
    {
      key: 'anomaly',
      prose: 'Unusually high freezer bill on <span class="font-medium text-ink">Dec 13</span> — ' + mono('+$1,834.66', 'red') + ' above your average.',
      card: anomalyCardHtml, mount: function () { mountAnomaly(); }, pill: 'Get tips on cutting freezer costs'
    },
    {
      key: 'allocation',
      prose: 'You’re heavily invested in ' + entity('Vanilla', 'bg-orange') + ' — it’s <span class="font-medium text-ink">72.5%</span> of your case.',
      card: allocCardHtml, mount: function () { mountAlloc(); }, pill: 'If we look at seasonals, what changes?'
    }
  ];

  var host = document.getElementById('ic-host');
  host.innerHTML =
    '<div class="min-h-[408px] w-full max-w-86">'
    + '<div class="flex items-center justify-between">'
    +   '<span class="flex items-baseline gap-1.5">'
    +     '<span class="text-[13px] font-semibold text-ink">Insights</span>'
    +     '<span class="text-[13px] text-ink-3 tabular-nums">' + PAGES.length + '</span>'
    +   '</span>'
    +   '<span class="flex items-center gap-0.5">'
    +     '<button type="button" data-move="-1" aria-label="Previous insight" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-[background-color,color,transform] duration-100 hover:bg-hover hover:text-ink active:scale-[0.96]"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></button>'
    +     '<button type="button" data-move="1" aria-label="Next insight" class="flex size-6 items-center justify-center rounded-[6px] text-ink-3 transition-[background-color,color,transform] duration-100 hover:bg-hover hover:text-ink active:scale-[0.96]"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></button>'
    +   '</span>'
    + '</div>'
    + '<div id="ic-pagewrap" class="transition-[opacity,filter] duration-250" style="opacity:1;filter:blur(0)">'
    +   '<p class="mt-1.5 text-[12.5px] leading-relaxed text-ink-2" id="ic-prose"></p>'
    +   '<div class="mt-2" id="ic-card"></div>'
    +   '<button type="button" class="mt-2 rounded-full bg-surface px-3 py-1.5 text-left text-[12px] text-ink shadow-btn transition-colors duration-100 hover:bg-hover" id="ic-pill"></button>'
    + '</div>'
    + '</div>';

  var pageWrap = document.getElementById('ic-pagewrap');
  var proseEl = document.getElementById('ic-prose');
  var cardEl = document.getElementById('ic-card');
  var pillEl = document.getElementById('ic-pill');

  function renderCard() {
    var p = PAGES[state.page];
    cardEl.innerHTML = p.card();
    p.mount();
  }
  function renderPage() {
    var p = PAGES[state.page];
    proseEl.innerHTML = p.prose;
    pillEl.textContent = p.pill;
    renderCard();
  }

  var moveBtns = host.querySelectorAll('[data-move]');
  for (var i = 0; i < moveBtns.length; i++) {
    moveBtns[i].addEventListener('click', function () {
      var dir = Number(this.getAttribute('data-move'));
      state.page = (state.page + dir + PAGES.length) % PAGES.length;
      /* 模糊淡入淡出（上游 transition-[opacity,filter] duration-250） */
      pageWrap.style.opacity = '0';
      pageWrap.style.filter = 'blur(4px)';
      requestAnimationFrame(function () {
        renderPage();
        requestAnimationFrame(function () {
          pageWrap.style.opacity = '1';
          pageWrap.style.filter = 'blur(0)';
        });
      });
    });
  }

  /* metric 切换（AnomalyCard 内部状态） */
  host.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-metric]') : null;
    if (!t) return;
    state.metric = t.getAttribute('data-metric');
    renderCard();
  });

  renderPage();
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
