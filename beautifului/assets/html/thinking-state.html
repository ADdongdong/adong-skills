/* ── minimal reset（替代 @import "tailwindcss"）─────────────── */
*,
*::before,
*::after {
  box-sizing: border-box;
  border: 0 solid;
}
html {
  -webkit-text-size-adjust: 100%;
  tab-size: 4;
}
body {
  margin: 0;
}
h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd, pre {
  margin: 0;
}
ol, ul, menu {
  margin: 0;
  padding: 0;
  list-style: none;
}
button, input, optgroup, select, textarea {
  margin: 0;
  padding: 0;
  color: inherit;
  font: inherit;
  letter-spacing: inherit;
  background: transparent;
  border-radius: 0;
}
button, [type="button"], [type="reset"], [type="submit"] {
  appearance: button;
}
textarea {
  resize: vertical;
}
img, svg, video, canvas, audio, iframe, embed, object {
  display: block;
  vertical-align: middle;
}
img, video {
  max-width: 100%;
  height: auto;
}
table {
  border-collapse: collapse;
  border-color: inherit;
  text-indent: 0;
}
a {
  color: inherit;
  text-decoration: inherit;
}
:disabled {
  cursor: default;
}

/* ── base ─────────────────────────────────────────────── */

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--stripe-bg);
  background-image: repeating-linear-gradient(
    -45deg,
    transparent 0,
    transparent 7px,
    var(--stripe) 7px,
    var(--stripe) 8px
  );
  /* Pin the stripe pattern to the viewport so it stays put on scroll. */
  background-attachment: fixed;
  color: var(--ink);
  font-feature-settings: "cv11", "ss01";
  font-size: 14px;
  letter-spacing: -0.01em;
  line-height: 1.5;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

/* ── interface hygiene (interfaces.dev cheat sheet) ────── */

/* headings balance; descriptions avoid orphans (skip long-form — we have none) */
h1,
h2,
h3,
h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

/* underlines clear descenders */
a {
  text-underline-position: from-font;
  text-decoration-skip-ink: auto;
}

/* theme switches swap every token at once — freeze transitions so the flip
 * is one clean repaint instead of hundreds of mismatched color fades */
.theme-switching *,
.theme-switching *::before,
.theme-switching *::after {
  transition: none !important;
}

/* touch: :hover sticks after a tap, so neutralize row/header hovers there */
@media (hover: none) {
  .records-row:hover > .records-cell {
    background: transparent;
  }

  .records-row:hover > td.is-colsel {
    background: color-mix(in srgb, var(--accent) 4%, var(--surface));
  }

  .records-header-button:hover {
    background: transparent;
    color: var(--ink-2);
  }
}

/* Keep the component nav scrollable but hide its scrollbar. */
.component-nav-scroll {
  scrollbar-width: none; /* Firefox */
  -ms-overflow-style: none; /* legacy Edge */
}
.component-nav-scroll::-webkit-scrollbar {
  display: none; /* WebKit */
}

@media (min-width: 64rem) {
  .component-nav-scroll {
    -webkit-mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
    mask-image: linear-gradient(
      to bottom,
      oklch(0 0 0) 0,
      oklch(0 0 0) calc(100% - 6rem),
      transparent 100%
    );
  }
}

/* Mobile demo gestures should operate controls and visualizations rather than
 * selecting surrounding labels. Text entry and code remain intentionally
 * selectable. */
@media (hover: none) and (pointer: coarse) {
  .primitive-showcase {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  .primitive-showcase :is(input, textarea, [contenteditable="true"], pre, code) {
    -webkit-user-select: text;
    user-select: text;
    -webkit-touch-callout: default;
  }

  .primitive-showcase :is(a, button, [role="button"]) {
    -webkit-tap-highlight-color: transparent;
  }

  .primitive-showcase :is(a, button, [role="button"]):focus-visible {
    outline: none;
  }

  .primitive-showcase :is(img, svg, canvas) {
    -webkit-user-drag: none;
  }

  .insight-chart-stage {
    touch-action: pan-y;
  }
}

/* Tailwind v4 resets buttons to cursor:default — anything
 * clickable must invite the click */
button:not(:disabled),
[role="button"]:not([aria-disabled="true"]),
label:has(input),
a {
  cursor: pointer;
}


:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 4px;
}

input:focus-visible,
textarea:focus-visible,
select:focus-visible,
[contenteditable]:focus-visible {
  outline: none;
}

.animated-underline {
  position: relative;
  display: inline-block;
}

.animated-underline::after {
  position: absolute;
  right: 0;
  bottom: -1px;
  left: 0;
  height: 1px;
  content: "";
  background: currentColor;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms var(--ease-link);
}

a:hover .animated-underline::after,
a:focus-visible .animated-underline::after {
  transform: scaleX(1);
}

/* ── primitive spacing system ─────────────────────────────

}

.primitive-card-bar {

}

.primitive-card-footer {

}

.primitive-table-cell {

}

  width: 28px;
  height: 28px;
  align-items: center;

  border-radius: var(--radius-control);
}

/* ── shared keyframes ─────────────────────────────────── */

@keyframes shimmer-text {
  from {
    background-position: 150% center;
  }
  to {
    background-position: -50% center;
  }
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.home-reveal {
  will-change: opacity, transform, filter;
}

/* The sidebar is one persistent 224px tree clipped by a 52px shell.
 * Every rail glyph remains centered at x=26 in both states. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — FilterTable
 * Electric status-pill colors.
 * Copy this block only alongside FilterTable; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  border: 1px solid transparent;
}

/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — InsightCards
 * Liveline chart tooltip + cursor.
 * Copy this block only alongside InsightCards; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.insight-chart-stage {
  overflow: hidden;
}

.insight-chart-cursor {
  position: absolute;
  z-index: 4;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.26;
  pointer-events: none;
}

.insight-chart-tooltip-anchor {
  position: absolute;
  z-index: 5;
  top: 8px;
  transform: translateX(-50%);
  pointer-events: none;
}

.insight-chart-tooltip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 9px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  color: var(--tooltip-fg);
  background: var(--tooltip-bg);
  box-shadow: var(--shadow-overlay);
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.insight-chart-tooltip-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.insight-chart-tooltip-dot {
  width: 8px;
  height: 8px;
  flex: 0 0 8px;
  border-radius: 50%;
}

/* Status pills share the same base-hue → color-mix derivation as .records-tag,
 * so both components stay consistent across light and dark. */
.filter-status-todo {
  --tag-base: oklch(0.757 0.153 66.401);
}
.filter-status-progress {
  --tag-base: oklch(0.671 0.118 219.351);
}
.filter-status-done {
  --tag-base: oklch(0.652 0.131 162.865);
}

.filter-status-todo,
.filter-status-progress,
.filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 92%, var(--ink));
  background: color-mix(in srgb, var(--tag-base) 20%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

/* Dark mode — a richer, saturated same-hue fill
 * with bright same-hue text and no visible border (light mode keeps the soft
 * tinted pastels above). Applies to both the records grid and status pills. */
.dark .records-tag,
.dark .filter-status-todo,
.dark .filter-status-progress,
.dark .filter-status-done {
  color: color-mix(in srgb, var(--tag-base) 86%, white);
  background: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
  border-color: color-mix(in srgb, var(--tag-base) 34%, var(--surface));
}

@keyframes fade-in {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes eq-bounce {
  0%,
  100% {
    transform: scaleY(0.35);
  }
  50% {
    transform: scaleY(1);
  }
}

/* ── StreamText primitive ─────────────────────────────────
 * Fast character reveal: the newest few characters carry a
 * soft, masked blur so the leading edge resolves smoothly as
 * text flows in. The caret holds solid while streaming, then
 * blinks once the string settles. */
/* ══════════════════════════════════════════════════════════
 * COMPONENT-SPECIFIC — StreamText
 * The streaming caret + tail.
 * Copy this block only alongside StreamText; it is not part of the
 * generic foundation above.
 * ══════════════════════════════════════════════════════════ */
.stream-tail {
  filter: blur(1.6px);
  -webkit-mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
  mask-image: linear-gradient(to right, oklch(0 0 0) 20%, oklch(0 0 0 / 0.2));
}

.stream-caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1.5px;
  translate: 0 -0.5px;
  border-radius: 1px;
  background: var(--ink);
  vertical-align: text-bottom;
  animation: caret-blink 1s step-end infinite;
}

.stream-caret.is-streaming {
  animation: none;
}

@keyframes caret-blink {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  .stream-caret {
    animation: none;
  }
  .stream-tail {
    filter: none;
    -webkit-mask-image: none;
    mask-image: none;
  }
}

@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.95);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

/* pixel-grid loader — brighten plateau, staggered per cell */
@keyframes pixel-on {
  0%, 100% {
    opacity: 0.15;
  }
  18%, 42% {
    opacity: 1;
  }
  62% {
    opacity: 0.15;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── port shell：演示舞台 ─────────────────────────────────── */
html {
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
body {
  min-height: 100vh;
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: var(--font-sans);
}
.port-stage {
  display: grid;
  min-height: 100vh;
  place-items: center;
  padding: 40px 24px;
}
.port-frame {
  display: flex;
  max-width: 100%;
  flex-direction: column;
  align-items: flex-start;
}
.port-theme-toggle {
  position: fixed;
  z-index: 50;
  top: 12px;
  right: 12px;
  display: inline-flex;
  height: 28px;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-control);
  color: var(--ink-2);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
  font-family: var(--font-mono);
  font-size: 11px;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-theme-toggle:hover {
  color: var(--ink);
  background: var(--hover);
}

/* ── port-only chrome：变体切换条 ─────────────────────────────
 * 上游画廊里「Drive / Dots / Orbit / Surfer」的切换属于站点外壳，不属于组件。
 * 移植件把它带上，方便一眼看全各变体；样式沿用令牌，不是上游代码。
 * ─────────────────────────────────────────────────────────── */
.port-variants {
  display: inline-flex;
  gap: 2px;
  margin-bottom: 20px;
  padding: 2px;
  border: 1px solid var(--line);
  border-radius: 9999px;
  background: var(--inset);
}
.port-variant-btn {
  padding: 4px 12px;
  border: 0;
  border-radius: 9999px;
  color: var(--ink-2);
  background: transparent;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  line-height: 1.4;
  cursor: pointer;
  transition: color 150ms var(--ease-out-strong), background-color 150ms var(--ease-out-strong);
}
.port-variant-btn:hover {
  color: var(--ink);
}
.port-variant-btn[aria-pressed="true"] {
  color: var(--ink);
  background: var(--surface);
  box-shadow: var(--shadow-btn);
}
/* 组件说明块（移植件顶部的一段中文用途说明） */
.port-note {
  max-width: 46ch;
  margin-bottom: 20px;
  color: var(--ink-2);
  font-size: 12.5px;
  line-height: 1.6;
}
.port-note code {
  padding: 1px 5px;
  border: 1px solid var(--line);
  border-radius: var(--radius-chip);
  background: var(--field);
  font-family: var(--font-mono);
  font-size: 11.5px;
}

/* ── 工具类（Tailwind 子集，由 twsubset.py 编译）───────────────
 * 颜色/圆角/阴影/缓动全部引用同名 var(--token)，
 * 因此配色与动效曲线与官网一致。
 * 选择器一律写成 [class~=] 属性形式而非转义类名：
 * 工具类含斜杠、冒号、方括号、百分号，转义极易出错。
 */

[class~="transition-[grid-template-rows,opacity]"] {
  transition-property: grid-template-rows,opacity;
  transition-duration: 150ms;
  transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
}

[class~="transition-colors"] {

[class~="transition-transform"] {

</style>
</head>
<body>
<div class="port-stage">
<!-- title: Thinking -->
<!--@classes: bg-accent bg-orange bg-green whitespace-normal leading-relaxed text-ink-2 font-medium text-ink animated-underline font-mono bg-inset hover:bg-hover-->
<!-- 来源：components/primitives/ThinkingState.tsx（上游 MIT）
     变体：Steps / Reasoning / Search / Coding（画廊里以标签切换，此处带上 port-variants 切换条）。
     保真：STAGES = [800, 600, 1800, 2600, 1600] 逐字照搬；working = stage<3；
           autoExpanded = 1<=stage<4；visible = stage<2 ? 0 : stage===2 ? min(2,rows) : rows；
           行入场 fade-up 320ms cubic-bezier(0.23,1,0.32,1) + i*120ms 逐条错开；
           竖线高度按 trace 实测高度（offsetHeight）动画到 -2px，与上游 useLayoutEffect 一致。
     降级：无。行节点采用「只追加不重建」策略，复现 React key 复用后旧行动画不重播的行为。
     演示取舍：上游跑一遍即停，移植件把它循环重放（便于直接观看）；首屏从 stage 2 起步，
           避开 0~1.4s「轨迹已展开但还没有行」的空窗期。时序常量本身未做任何压缩。
     markup 与上游逐类对齐：border-[1.5px] 与 duration-100/300/400 都用上游原类名
           （twsubset 现已把任意边框宽度编译成 border-width，并按 transition-* → duration-* 的顺序
           输出，故不需要内联兜底）。
     @classes 里声明的是 JS 三元/变量产生的分支类（TONES 三色、primary 文本样式、row.mono、
     选中态 bg-inset / hover:bg-hover），它们不出现在静态 class 属性里，必须显式声明。-->

<div class="port-frame">
  <p class="port-note">
    <strong>思考轨迹</strong> — 可展开的 Agent 推理 trace，四个变体：
    <code>Steps</code> 步骤清单（旋转指示器 → 灰勾）、<code>Reasoning</code> 散文式推理、
    <code>Search</code> 检索轨迹（查询词 + 来源链接）、<code>Coding</code> 工具轨迹（读文件 / 改文件 / 跑命令）。
    轨迹跑完一次后停在已完成态，仍可手动展开/折叠。
  </p>

  <div class="port-variants" role="group" aria-label="变体">
    <button type="button" class="port-variant-btn" data-variant="Steps" aria-pressed="true">Steps</button>
    <button type="button" class="port-variant-btn" data-variant="Reasoning" aria-pressed="false">Reasoning</button>
    <button type="button" class="port-variant-btn" data-variant="Search" aria-pressed="false">Search</button>
    <button type="button" class="port-variant-btn" data-variant="Coding" aria-pressed="false">Coding</button>
  </div>

  <div id="think-host" class="w-[380px] max-w-full"></div>
</div>

<script>
(function () {
  /* ── 时序常量：逐字照搬上游 ────────────────────────────────────
   * const STAGES = [800, 600, 1800, 2600, 1600];
   * 累进：stage0→1 @800ms，1→2 @1400ms，2→3 @3200ms，3→4 @5800ms。
   * useSequence 在 stage >= steps.length-1 时停止，所以尾项 1600ms 不参与（与上游一致）。
   * ──────────────────────────────────────────────────────────── */
  var STAGES = [800, 600, 1800, 2600, 1600];

  var VARIANTS = {
    Steps: {
      active: 'Thinking',
      done: 'Thought for 4 seconds',
      rows: [
        { primary: 'Reading flavor briefs' },
        { primary: 'Scanning supplier lists' },
        { primary: 'Comparing tasting notes', secondary: '6 flavors' },
        { primary: 'Writing the scoop report' }
      ]
    },
    Reasoning: {
      active: 'Thinking',
      done: 'Thought for 4 seconds',
      rows: [
        { primary: 'Summer demand spikes for stone-fruit flavors — peach and apricot lead.' },
        { primary: 'I should check cone inventory before promoting a waffle-bowl special.' }
      ]
    },
    Search: {
      active: 'Searching the web',
      done: 'Searched the web',
      query: 'best waffle cone supplier',
      rows: [
        { primary: 'Joy Cone', secondary: 'joycone.com', href: 'https://joycone.com/fs_products/waffle-cones/' },
        { primary: 'WebstaurantStore', secondary: 'webstaurantstore.com', href: 'https://www.webstaurantstore.com/ice-cream-shop-supplies.html' },
        { primary: 'The Konery', secondary: 'thekonery.com', href: 'https://www.thekonery.com/' }
      ]
    },
    Coding: {
      active: 'Running tools',
      done: 'Ran 3 tools',
      rows: [
        { primary: 'Read', secondary: 'flavors.ts', mono: true },
        { primary: 'Edit', secondary: 'ChurnSchedule.tsx', mono: true, add: 74, del: 41 },
        { primary: 'Run', secondary: 'npm run freeze', mono: true }
      ]
    }
  };

  /* Dot 的三色轮转（上游 const TONES = ["bg-accent","bg-orange","bg-green"]） */
  var TONES = ['bg-accent', 'bg-orange', 'bg-green'];

  var CHECK_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="shrink-0"><path d="M20 6L9 17l-5-5"/></svg>';
  var SEARCH_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-linecap="round" class="shrink-0"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
  var SPINNER_SPAN = '<span class="size-3 shrink-0 rounded-full border-[1.5px] border-line-strong border-t-ink-2" style="animation:spin 700ms linear infinite"></span>';
  var DOT_SVG = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  var CHEVRON_SVG_START = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--ink-3)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="transition-transform duration-300" style="transform:rotate(';
  var CHEVRON_SVG_END = 'deg)"><path d="M6 9l6 6 6-6"/></svg>';

  var host = document.getElementById('think-host');
  var state = { variant: 'Steps', stage: 0, manualExpanded: null, selectedTool: null, lineHeight: 0 };
  var timers = [];
  var els = null;

  function clearTimers() {
    for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]);
    timers = [];
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* ── 外壳（只在切换变体时重建，行容器内只追加，见 sync） ────────── */
  function buildShell() {
    host.innerHTML =
      '<div class="flex w-full max-w-95 flex-col" data-root style="transition:min-height 400ms cubic-bezier(0.23,1,0.32,1)">'
      +   '<button type="button" data-header class="-mx-1.5 flex w-fit items-center gap-2 rounded-control px-1.5 py-1 transition-colors duration-100 hover:bg-hover-2">'
      +     '<span data-sparkle></span>'
      +     '<span role="status" class="contents" data-label></span>'
      +     '<span data-chevron></span>'
      +   '</button>'
      +   '<div class="grid transition-[grid-template-rows,opacity] duration-400" data-grid style="grid-template-rows:0fr;opacity:0;transition-timing-function:cubic-bezier(0.23,1,0.32,1)">'
      +     '<div class="overflow-hidden">'
      +       '<div class="relative mt-1 ml-[5px] pl-4">'
      +         '<span aria-hidden class="absolute left-[3px] w-px bg-line" data-line style="top:-8px;height:0;transition:height 500ms cubic-bezier(0.23,1,0.32,1)"></span>'
      +         '<div class="flex flex-col gap-1 py-1" data-trace></div>'
      +       '</div>'
      +     '</div>'
      +   '</div>'
      + '</div>';
    els = {
      root: host.querySelector('[data-root]'),
      header: host.querySelector('[data-header]'),
      sparkle: host.querySelector('[data-sparkle]'),
      label: host.querySelector('[data-label]'),
      chevron: host.querySelector('[data-chevron]'),
      grid: host.querySelector('[data-grid]'),
      line: host.querySelector('[data-line]'),
      trace: host.querySelector('[data-trace]')
    };
    els.header.addEventListener('click', function () {
      var auto = state.stage >= 1 && state.stage < 4;
      state.manualExpanded = !(state.manualExpanded === null ? auto : state.manualExpanded);
      sync();
    });
    els.trace.addEventListener('click', function (event) {
      var btn = event.target.closest('[data-tool]');
      if (!btn) return;
      var name = btn.getAttribute('data-tool');
      state.selectedTool = state.selectedTool === name ? null : name;
      sync();
    });
  }

  /* ── 行内容（与上游 JSX 的 content 片段一一对应） ─────────────── */
  function rowInner(variant, row, i, visible, working) {
    var s = '';
    if (variant === 'Search') {
      s += '<span class="flex size-3.5 shrink-0 items-center justify-center rounded-full text-white ' + TONES[i % 3] + '">' + DOT_SVG + '</span>';
    }
    if (variant === 'Steps') {
      s += (i < visible - 1 || !working) ? CHECK_SVG : SPINNER_SPAN;
    }
    /* Reasoning 用散文排版，Search 的标题带下划线动效，其余是常规 list 文本 */
    var primaryCls = variant === 'Reasoning'
      ? 'whitespace-normal leading-relaxed text-ink-2'
      : 'font-medium text-ink';
    var underline = variant === 'Search' ? ' animated-underline' : '';
    s += '<span class="min-w-0 truncate text-[12.5px] ' + primaryCls + underline + '">' + esc(row.primary) + '</span>';
    if (row.secondary) {
      s += '<span class="shrink-0 text-[11.5px] text-ink-3' + (row.mono ? ' font-mono' : '') + '">' + esc(row.secondary) + '</span>';
    }
    if (row.add !== undefined) {
      s += '<span class="shrink-0 font-mono text-[11px] tabular-nums">'
        + '<span class="text-green">+' + row.add + '</span> '
        + '<span class="text-red">−' + row.del + '</span></span>';
    }
    return s;
  }

  /* 行元素：用 innerHTML 模板构造，好让行上的类名出现在 `class="..."` 字面量里
   * （组装脚本只从 class="..." 收集类名；用 el.className = '...' 赋值的类会被静默丢弃）。 */
  function rowEl(variant, row, i, visible, working) {
    var anim = 'animation:fade-up 320ms cubic-bezier(0.23,1,0.32,1) ' + (i * 120) + 'ms both';
    var inner = rowInner(variant, row, i, visible, working);
    var wrap = document.createElement('div');

    if (variant === 'Search') {
      wrap.innerHTML = '<a href="' + row.href + '" target="_blank" rel="noreferrer" class="flex min-h-7 w-full items-center gap-2 rounded-[6px] px-1.5 py-0.5 text-left transition-colors duration-150 hover:bg-hover" style="' + anim + '">' + inner + '</a>';
    } else if (variant === 'Coding') {
      var picked = state.selectedTool === row.primary;
      wrap.innerHTML = '<button type="button" aria-pressed="' + (picked ? 'true' : 'false') + '" data-tool="' + esc(row.primary) + '" class="flex min-h-7 w-full items-center gap-2 rounded-[6px] px-1.5 py-0.5 text-left transition-colors duration-150 ' + (picked ? 'bg-inset' : 'hover:bg-hover') + '" style="' + anim + '">' + inner + '</button>';
    } else {
      wrap.innerHTML = '<div class="flex min-h-7 w-full items-center gap-2 rounded-[6px] px-1.5 py-0.5 text-left" style="' + anim + '">' + inner + '</div>';
    }
    return wrap.firstChild;
  }

  /* ── 主渲染：更新外壳状态 + 只追加缺失的行 ─────────────────── */
  function sync() {
    var v = VARIANTS[state.variant];
    var stage = state.stage;
    var autoExpanded = stage >= 1 && stage < 4;
    var expanded = state.manualExpanded === null ? autoExpanded : state.manualExpanded;
    var working = stage < 3;
    var visible = stage < 2 ? 0 : (stage === 2 ? Math.min(2, v.rows.length) : v.rows.length);

    /* 头部：图标填充色 + 状态文案 + chevron 旋转 */
    els.sparkle.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="'
      + (working ? 'var(--ink-2)' : 'var(--ink-3)')
      + '"><path d="M12 2l2.4 7.2L22 12l-7.6 2.8L12 22l-2.4-7.2L2 12l7.6-2.8z"/></svg>';

    var labelHTML = working
      ? '<span class="bg-clip-text text-[13px] font-medium whitespace-nowrap text-transparent" style="background-image:linear-gradient(90deg, var(--ink-3) 35%, var(--ink) 50%, var(--ink-3) 65%);background-size:200% 100%;animation:shimmer-text 1.4s linear infinite">' + esc(v.active) + '</span>'
      : '<span class="text-[13px] font-medium whitespace-nowrap text-ink-2" style="animation:fade-in 350ms ease-out both">' + esc(v.done) + '</span>';
    if (els.label.__html !== labelHTML) {
      els.label.innerHTML = labelHTML;
      els.label.__html = labelHTML;
    }
    els.header.setAttribute('aria-expanded', expanded ? 'true' : 'false');
    els.chevron.innerHTML = CHEVRON_SVG_START + (expanded ? 180 : 0) + CHEVRON_SVG_END;

    /* 根容器：working 或展开时给 176px 最小高度，带 400ms 强曲线过渡 */
    els.root.style.minHeight = (working || expanded) ? '176px' : '';

    /* 展开/收起：grid-template-rows 1fr/0fr + opacity */
    els.grid.style.gridTemplateRows = expanded ? '1fr' : '0fr';
    els.grid.style.opacity = expanded ? '1' : '0';

    /* 行：只追加缺失的节点（避免重建导致旧行动画重播，对齐 React key 复用行为），
     * 已存在的行就地更新会变的部分：Steps 的指示器（spinner↔勾）、Coding 的选中态。 */
    var trace = els.trace;
    for (var i = 0; i < visible; i++) {
      var node = trace.children[i];
      if (!node) {
        node = rowEl(state.variant, v.rows[i], i, visible, working);
        trace.appendChild(node);
      } else if (state.variant === 'Steps') {
        node.innerHTML = rowInner('Steps', v.rows[i], i, visible, working);
      } else if (state.variant === 'Coding') {
        var picked = state.selectedTool === v.rows[i].primary;
        node.className = 'flex min-h-7 w-full items-center gap-2 rounded-[6px] px-1.5 py-0.5 text-left transition-colors duration-150 '
          + (picked ? 'bg-inset' : 'hover:bg-hover');
        node.setAttribute('aria-pressed', picked ? 'true' : 'false');
      }
    }
    if (state.variant === 'Search') {
      if (stage >= 3 && !trace.querySelector('[data-more]')) {
        var more = document.createElement('span');
        more.className = 'text-[12px] text-ink-3';
        more.setAttribute('data-more', '');
        more.setAttribute('style', 'animation:fade-in 300ms ease-out both');
        more.textContent = '+7 more';
        trace.appendChild(more);
      }
    }

    /* 竖线高度 = trace 实测高度 - 2px（上游 useLayoutEffect + offsetHeight） */
    state.lineHeight = trace.offsetHeight;
    els.line.style.height = (state.lineHeight ? state.lineHeight - 2 : 0) + 'px';
  }

  function schedule(onSettled) {
    if (state.stage >= STAGES.length - 1) {
      if (onSettled) onSettled();
      return;
    }
    var delay = STAGES[state.stage];
    timers.push(setTimeout(function () {
      state.stage += 1;
      sync();
      schedule(onSettled);
    }, delay));
  }

  /* 演示循环：上游是「跑一遍即停」，单文件移植件在这里把它循环重放，方便直接观看。
   * 时序本身（STAGES 与上面的 stage→状态映射）完全照搬，没有压缩。
   * 唯一演示取舍：首屏从 stage 2 起步 —— 上游 0~1.4s 的 stage 0/1 阶段
   * visible=0（轨迹展开但还没有行），首帧会显得空；从 stage 2 起步可直接看到
   * 「行逐个出现」。之后每次重放与切换变体都从 stage 0 完整播放。 */
  var HOLD_MS = 2400;

  function play(startStage) {
    clearTimers();
    state.stage = startStage;
    state.manualExpanded = null;
    state.selectedTool = null;
    buildShell();
    sync();
    schedule(function () {
      timers.push(setTimeout(function () { play(0); }, HOLD_MS));
    });
  }

  var btns = document.querySelectorAll('.port-variant-btn');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      for (var j = 0; j < btns.length; j++) btns[j].setAttribute('aria-pressed', 'false');
      this.setAttribute('aria-pressed', 'true');
      state.variant = this.getAttribute('data-variant');
      play(0);
    });
  }
  play(2);
})();
</script>
</div>
<button type="button" class="port-theme-toggle" id="port-theme-toggle" aria-label="切换明暗主题">
  <span id="port-theme-label">dark</span>
</button>
<script>
(function () {
  var root = document.documentElement;
  var label = document.getElementById('port-theme-label');
  var btn = document.getElementById('port-theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var dark = root.classList.toggle('dark');
    if (label) label.textContent = dark ? 'light' : 'dark';
  });
})();
</script>

</body>
</html>
